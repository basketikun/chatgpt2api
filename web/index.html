  <div class="drawer app" x-data :class="{ 'lg:drawer-open': $store.app.nav }">
    <input id="nav-drawer" type="checkbox" class="drawer-toggle" x-model="$store.app.navOpen">

    <div class="drawer-content shell-content">
      <div class="mobile-bar" x-show="$store.app.nav" x-cloak>
        <label for="nav-drawer" class="btn btn-ghost btn-sm btn-square" aria-label="打开导航"><ui-icon name="menu"></ui-icon></label>
        <span class="brand-name">ChatGPT2API</span>
      </div>
      <main class="main" id="view"></main>
    </div>

    <div class="drawer-side" x-show="$store.app.nav" x-cloak>
      <label for="nav-drawer" class="drawer-overlay" aria-label="关闭导航"></label>
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-name">ChatGPT2API</span>
          <button type="button" class="brand-version" x-text="'v' + $store.app.version" :data-new="$store.app.hasUpdate" @click="$store.app.openReleases()"></button>
          <span class="spacer"></span>
          <a class="btn btn-ghost btn-xs btn-square tooltip tooltip-bottom" data-tip="GitHub" href="https://github.com/basketikun/chatgpt2api" target="_blank" rel="noreferrer" aria-label="GitHub"><ui-icon name="github" class="icon-sm"></ui-icon></a>
        </div>

        <nav class="nav">
          <template x-for="item in $store.app.navItems" :key="item.path ?? item.group">
            <div>
              <template x-if="item.group"><div class="nav-group" x-text="item.group"></div></template>
              <template x-if="item.path">
                <a class="nav-item" :href="item.path" :aria-current="$store.app.path === item.path ? 'page' : null" @click="$store.app.navOpen = false">
                  <ui-icon :name="item.icon"></ui-icon>
                  <span x-text="item.label"></span>
                </a>
              </template>
            </div>
          </template>
        </nav>

        <div class="sidebar-foot">
          <span class="grow truncate text-muted" x-text="$store.app.session?.name || ($store.app.session?.role === 'admin' ? '管理员' : '用户')"></span>
          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-top" data-tip="退出登录" aria-label="退出登录" @click="$store.app.logout()"><ui-icon name="log-out"></ui-icon></button>
        </div>
      </aside>
    </div>
  </div>

  <!-- 全局提示：只承载失败、等待与需要处理的消息 -->
  <div class="toast toast-top toast-center" x-data>
    <template x-for="item in $store.toast.items" :key="item.id">
      <div class="alert alert-soft" :class="{ 'alert-error': item.type === 'error', 'alert-warning': item.type === 'warning', 'alert-info': item.type === 'info', 'alert-success': item.type === 'success' }" role="status">
        <ui-icon :name="item.icon || { error: 'circle-x', warning: 'triangle-alert', success: 'circle-check', info: 'info' }[item.type]"></ui-icon>
        <span x-text="item.text"></span>
      </div>
    </template>
  </div>

  <!-- 全局确认弹窗 -->
  <dialog class="modal" x-data x-effect="$store.confirm.open ? $el.showModal() : $el.close()" @close="$store.confirm.open && $store.confirm.done(false)">
    <div class="modal-box">
      <h3 class="modal-title" x-text="$store.confirm.title"></h3>
      <p class="text-muted" x-show="$store.confirm.text" x-text="$store.confirm.text"></p>
      <div class="modal-action">
        <button type="button" class="btn btn-sm" @click="$store.confirm.done(false)">取消</button>
        <button type="button" class="btn btn-sm" :class="$store.confirm.danger ? 'btn-error' : 'btn-primary'" x-text="$store.confirm.ok" @click="$store.confirm.done(true)"></button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
  </dialog>

  <!-- 版本更新 -->
  <dialog class="modal" x-data x-effect="$store.app.releasesOpen ? $el.showModal() : $el.close()" @close="$store.app.releasesOpen = false">
    <div class="modal-box modal-md">
      <div class="row row-between modal-title">
        <span>版本更新</span>
        <span class="text-xs text-muted num">当前 v<span x-text="$store.app.version"></span> · 最新 v<span x-text="$store.app.latest || '—'"></span></span>
      </div>
      <div x-show="$store.app.checking" class="center-fill"><span class="loading loading-spinner loading-sm"></span></div>
      <div class="vstack vstack-lg" x-show="!$store.app.checking">
        <template x-for="release in $store.app.releases" :key="release.version">
          <section class="vstack vstack-sm">
            <div class="row">
              <span class="title-section num" x-text="release.version === 'Unreleased' ? '未发布' : 'v' + release.version"></span>
              <span class="badge badge-sm badge-soft" x-show="release.version === $store.app.version">当前</span>
              <span class="spacer"></span>
              <span class="text-xs text-subtle num" x-text="release.date"></span>
            </div>
            <template x-for="item in release.items">
              <div class="row row-start">
                <span class="badge badge-sm badge-soft shrink-0" :class="{ 'badge-success': item.type === '新增', 'badge-info': item.type === '修复' }" x-text="item.type"></span>
                <div class="markdown text-muted" x-html="$md(item.content)"></div>
              </div>
            </template>
          </section>
        </template>
      </div>
      <div class="modal-action">
        <a class="btn btn-sm" :class="$store.app.hasUpdate ? 'btn-primary' : ''" href="https://github.com/basketikun/chatgpt2api" target="_blank" rel="noreferrer">前往 GitHub<ui-icon name="external-link" class="icon-sm"></ui-icon></a>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
  </dialog>

  <!-- 图片查看器 -->
  <div class="lightbox" x-data x-show="$store.lightbox.open" x-cloak
       @keydown.escape.window="$store.lightbox.open = false"
       @keydown.left.window="$store.lightbox.open && $store.lightbox.index > 0 && ($store.lightbox.index--, $store.lightbox.zoom = false)"
       @keydown.right.window="$store.lightbox.open && $store.lightbox.index < $store.lightbox.images.length - 1 && ($store.lightbox.index++, $store.lightbox.zoom = false)"
       @click.self="$store.lightbox.open = false">
    <template x-if="$store.lightbox.open">
      <img :src="$store.lightbox.images[$store.lightbox.index].src" alt="" :class="{ zoomed: $store.lightbox.zoom }" @click="$store.lightbox.zoom = !$store.lightbox.zoom">
    </template>
    <div class="lightbox-bar row">
      <span class="chip num" x-show="$store.lightbox.images[$store.lightbox.index]?.meta" x-text="$store.lightbox.images[$store.lightbox.index]?.meta"></span>
      <span class="chip num" x-show="$store.lightbox.images.length > 1" x-text="($store.lightbox.index + 1) + ' / ' + $store.lightbox.images.length"></span>
      <a class="btn btn-sm btn-circle" :href="$store.lightbox.images[$store.lightbox.index]?.src" download aria-label="下载图片"><ui-icon name="download"></ui-icon></a>
      <button type="button" class="btn btn-sm btn-circle" aria-label="关闭" @click="$store.lightbox.open = false"><ui-icon name="x"></ui-icon></button>
    </div>
    <button type="button" class="lightbox-nav lightbox-prev btn btn-circle" aria-label="上一张" x-show="$store.lightbox.index > 0" @click="$store.lightbox.index--; $store.lightbox.zoom = false"><ui-icon name="chevron-left"></ui-icon></button>
    <button type="button" class="lightbox-nav lightbox-next btn btn-circle" aria-label="下一张" x-show="$store.lightbox.index < $store.lightbox.images.length - 1" @click="$store.lightbox.index++; $store.lightbox.zoom = false"><ui-icon name="chevron-right"></ui-icon></button>
  </div>

  <!-- 页面模板：路由按 id 克隆到主内容区 -->
  <template id="page-login">
    <div class="login" x-data="login">
      <form class="login-card vstack vstack-lg" @submit.prevent="submit">
        <div class="vstack login-hero">
          <ui-icon name="openai" class="login-logo"></ui-icon>
          <h1 class="login-title">ChatGPT2API</h1>
          <p class="login-sub">对话、生图、文件与语音，一个密钥全部搞定</p>
        </div>
        <div class="field">
          <label class="field-label" for="login-key">访问密钥</label>
          <label class="input" :class="{ 'input-error': error }">
            <ui-icon name="key-round" class="text-subtle"></ui-icon>
            <input id="login-key" :type="visible ? 'text' : 'password'" x-model="key" autocomplete="current-password" autofocus @input="error = ''">
            <button type="button" class="btn btn-ghost btn-xs btn-square" :aria-label="visible ? '隐藏密钥' : '显示密钥'" @click="visible = !visible"><ui-icon :name="visible ? 'eye-off' : 'eye'" class="icon-sm"></ui-icon></button>
          </label>
          <span class="field-error" x-show="error" x-text="error"></span>
        </div>
        <button type="submit" class="btn btn-primary" :disabled="!key || loading">
          <span class="loading loading-spinner loading-xs" x-show="loading"></span>登录
        </button>
      </form>
      <a class="row login-github" href="https://github.com/basketikun/chatgpt2api" target="_blank" rel="noreferrer"><ui-icon name="github" class="icon-sm"></ui-icon>basketikun/chatgpt2api</a>
    </div>
  </template>

  <template id="page-overview">
    <div class="page" x-data="overview">
      <div class="page-head">
        <h1 class="title-page">概览</h1>
        <div class="row">
          <div class="tabs tabs-box tabs-sm" role="tablist">
            <button type="button" role="tab" class="tab" :class="{ 'tab-active': period === '24h' }" @click="period = '24h'">24 小时</button>
            <button type="button" role="tab" class="tab" :class="{ 'tab-active': period === '7d' }" @click="period = '7d'">7 天</button>
          </div>
          <button type="button" class="btn btn-sm tooltip tooltip-left" :data-tip="calls ? '更新于 ' + $time(calls.sampled_at) : null" :disabled="loading" @click="refresh()">
            <ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: loading }"></ui-icon>刷新
          </button>
        </div>
      </div>

      <div class="vstack vstack-lg">
        <div role="alert" class="alert alert-error alert-soft" x-show="callsError" x-cloak>
          <ui-icon name="circle-x"></ui-icon><span>调用统计暂时无法更新：<span x-text="callsError"></span></span>
        </div>

        <template x-if="!calls && !callsError">
          <div class="grid grid-4"><template x-for="i in 4"><div class="skeleton metric-skeleton"></div></template></div>
        </template>

        <template x-if="calls">
          <div class="vstack vstack-lg">
            <div class="grid grid-4">
              <template x-for="metric in metrics" :key="metric.label">
                <div class="metric-tile">
                  <div class="metric-label"><span x-text="metric.label"></span><ui-icon :name="metric.icon" class="icon-sm"></ui-icon></div>
                  <div class="metric-value" x-text="metric.value"></div>
                  <div class="metric-meta" x-text="metric.meta"></div>
                </div>
              </template>
            </div>

            <div class="grid grid-main-side">
              <section class="panel">
                <div class="panel-head"><h2 class="title-section">调用趋势</h2></div>
                <div class="chart-box" x-show="calls.summary.total"><canvas x-ref="trend" aria-label="各时段成功、失败和进行中的调用数量"></canvas></div>
                <div class="empty chart-box" x-show="!calls.summary.total"><ui-icon name="activity"></ui-icon>这个时段暂无调用</div>
              </section>

              <section class="panel">
                <div class="panel-head"><h2 class="title-section">模型调用</h2></div>
                <div class="table-wrap">
                  <table class="table table-sm">
                    <thead><tr><th>模型</th><th class="text-right">调用</th><th class="text-right">成功率</th></tr></thead>
                    <tbody>
                      <template x-for="model in pagedModels" :key="model.model">
                        <tr>
                          <td><ui-model :name="model.model" x-show="model.model"></ui-model><span class="text-subtle" x-show="!model.model">未指定模型</span></td>
                          <td class="text-right num" x-text="$num(model.total)"></td>
                          <td class="text-right num" x-text="rate(model.success_rate)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
                <div class="empty" x-show="!calls.models.length"><ui-icon name="list-tree"></ui-icon>暂无模型调用</div>
                <ui-pager x-show="calls.models.length > modelSize" :page="modelPage" :size="modelSize" :total="calls.models.length" sizes="8,20,50" @change="modelPage = $event.detail.page; modelSize = $event.detail.size"></ui-pager>
              </section>
            </div>
          </div>
        </template>

        <section class="vstack vstack-md">
          <div class="row">
            <h2 class="title-section">系统资源</h2>
            <span class="tooltip tooltip-right field-help" data-tip="内存为本服务进程自身的占用，系统整体用量显示在下方说明里；磁盘为运行目录所在磁盘。"><ui-icon name="info" class="icon-sm"></ui-icon></span>
          </div>
          <div role="alert" class="alert alert-error alert-soft" x-show="systemError" x-cloak>
            <ui-icon name="circle-x"></ui-icon><span>系统资源暂时无法更新：<span x-text="systemError"></span></span>
          </div>
          <div role="alert" class="alert alert-warning alert-soft" x-show="system && Object.keys(system.errors).length" x-cloak>
            <ui-icon name="triangle-alert"></ui-icon><span>部分资源暂时无法读取：<span x-text="system && Object.values(system.errors).join('；')"></span></span>
          </div>
          <div class="grid grid-2">
            <template x-for="item in resources" :key="item.label">
              <div class="metric-tile">
                <div class="metric-label"><span x-text="item.label"></span><span class="tooltip tooltip-left" :data-tip="item.tip"><ui-icon :name="item.icon" class="icon-sm"></ui-icon></span></div>
                <div class="metric-value" x-text="item.percent == null ? '—' : item.percent.toFixed(1) + '%'"></div>
                <progress class="progress" :class="item.percent >= 90 ? 'progress-error' : 'progress-neutral'" :value="item.percent ?? 0" max="100"></progress>
                <div class="metric-meta num" x-text="item.meta"></div>
              </div>
            </template>
          </div>
        </section>
      </div>
    </div>
  </template>

  <template id="page-chat">
    <div class="workspace chat-page" x-data="chat">
      <div class="chat-scrim" x-show="sideOpen" x-cloak @click="sideOpen = false"></div>

      <aside class="chat-side" :class="{ open: sideOpen }">
        <div class="brand" x-show="!$store.app.admin" x-cloak>
          <span class="brand-name">ChatGPT2API</span>
          <button type="button" class="brand-version" x-text="'v' + $store.app.version" :data-new="$store.app.hasUpdate" @click="$store.app.openReleases()"></button>
          <span class="spacer"></span>
          <a class="btn btn-ghost btn-xs btn-square tooltip tooltip-bottom" data-tip="GitHub" href="https://github.com/basketikun/chatgpt2api" target="_blank" rel="noreferrer" aria-label="GitHub"><ui-icon name="github" class="icon-sm"></ui-icon></a>
          <button type="button" class="btn btn-ghost btn-xs btn-square tooltip tooltip-bottom" data-tip="退出登录" aria-label="退出登录" @click="$store.app.logout()"><ui-icon name="log-out" class="icon-sm"></ui-icon></button>
        </div>
        <button type="button" class="btn btn-sm chat-new" @click="newRecord()"><ui-icon name="square-pen" class="icon-sm"></ui-icon>新建</button>
        <div class="row row-between chat-side-head">
          <span>记录 <span class="num" x-text="list.length"></span></span>
          <button type="button" class="btn btn-ghost btn-xs btn-square btn-plain text-danger" aria-label="清空" x-show="list.length" :disabled="loading" @click="clearAll()"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
        </div>
        <nav class="chat-list" aria-label="创作记录">
          <template x-for="item in list" :key="item.id">
            <div class="chat-item" :aria-current="activeId === item.id ? 'true' : null">
              <button type="button" class="chat-item-title" :title="item.title" @click="select(item.id)">
                <ui-icon :name="recordIcons[item.type]" class="icon-sm text-subtle"></ui-icon>
                <span class="truncate" x-text="item.title"></span>
              </button>
              <button type="button" class="btn btn-ghost btn-xs btn-square chat-item-delete tooltip tooltip-left" data-tip="删除" aria-label="删除" :disabled="loading" @click="remove(item)"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
            </div>
          </template>
          <div class="empty" x-show="!list.length"><ui-icon name="history"></ui-icon>暂无记录</div>
        </nav>
      </aside>

      <section class="chat-main">
        <button type="button" class="btn btn-ghost btn-sm btn-square chat-menu" aria-label="创作记录" @click="sideOpen = true"><ui-icon name="panel-left"></ui-icon></button>

        <div class="chat-stream" x-show="messages.length" x-effect="follow($el)">
          <div class="chat-thread">
            <template x-for="(message, index) in messages" :key="activeId + '-' + index">
              <div class="chat-msg" :class="message.role">
                <template x-if="message.role === 'user'">
                  <div class="vstack vstack-sm chat-user">
                    <div class="chat-user-images" x-show="parts(message, 'image_url').length">
                      <template x-for="(part, imageIndex) in parts(message, 'image_url')" :key="imageIndex">
                        <figure class="chat-user-image">
                          <button type="button" class="chat-zoom" @click="lightbox(parts(message, 'image_url').map((item) => ({ src: item.image_url.url })), imageIndex)"><img :src="part.image_url.url" alt="" loading="lazy"></button>
                          <button type="button" class="btn btn-ghost btn-xs" @click="addToEdit(part.image_url.url, 'image-' + (imageIndex + 1) + '.png')"><ui-icon name="image-plus" class="icon-sm"></ui-icon>加入编辑</button>
                        </figure>
                      </template>
                    </div>
                    <template x-for="part in parts(message, 'audio_file')" :key="part.name">
                      <div class="tile row chat-audio-file">
                        <ui-icon name="mic" class="icon-sm"></ui-icon>
                        <span class="truncate" x-text="part.name"></span>
                        <span class="text-xs text-subtle num" x-text="$bytes(part.size)"></span>
                      </div>
                    </template>
                    <div class="bubble" x-show="text(message)" x-text="text(message)"></div>
                    <template x-if="messages[index + 1]?.image_turn">
                      <div class="row row-xs chat-user-meta">
                        <span class="text-xs text-muted num" x-text="turnMeta(messages[index + 1].image_turn)"></span>
                        <button type="button" class="btn btn-ghost btn-xs" :disabled="loading" @click="reuseTurn(messages[index + 1].image_turn)"><ui-icon name="sliders-horizontal" class="icon-sm"></ui-icon>复用配置</button>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="message.role === 'assistant'">
                  <div class="vstack vstack-md">
                    <template x-for="part in parts(message, 'audio')" :key="part.url.length">
                      <audio controls class="chat-audio" :src="part.url"></audio>
                    </template>

                    <div class="chat-tasks" :class="{ single: parts(message, 'image_task').length === 1 }" x-show="parts(message, 'image_task').length">
                      <template x-for="part in parts(message, 'image_task')" :key="part.task_id">
                        <div class="chat-task">
                          <div class="chat-task-media" :class="{ 'chat-task-loading': part.status === 'running' || part.status === 'queued' }" :style="{ aspectRatio: part.ratio === 'auto' ? '1' : part.ratio.replace(':', ' / ') }">
                            <template x-if="part.status === 'success'">
                              <button type="button" class="chat-zoom chat-task-image" x-data="{ dim: '', bytes: 0 }" @click="openImage(message, part)"><img :src="part.url" :alt="'结果 ' + part.index" loading="lazy" @load="dim = $el.naturalWidth + '×' + $el.naturalHeight; fetch(part.url).then((response) => response.blob()).then((blob) => bytes = blob.size)"><span class="chat-task-badge num" x-show="dim" x-text="dim + (bytes ? ' · ' + $bytes(bytes) : '')"></span></button>
                            </template>
                            <template x-if="part.status !== 'success'">
                              <div class="chat-task-state">
                                <ui-icon name="triangle-alert" class="icon-lg text-danger" x-show="part.status === 'error'"></ui-icon>
                                <span class="text-strong" x-text="'图片 ' + part.index + '/' + part.total"></span>
                                <span class="text-xs" :class="{ 'text-danger': part.status === 'error' }" x-text="part.status === 'error' ? part.error : part.status === 'queued' ? '排队中' : progressLabels[part.progress] || '生成中'"></span>
                              </div>
                            </template>
                          </div>
                          <div class="chat-task-foot row row-between">
                            <span class="text-xs text-muted num" x-text="taskMeta(part)"></span>
                            <div class="row row-xs">
                              <template x-if="part.status === 'success'">
                                <div class="row row-xs">
                                  <button type="button" class="btn btn-ghost btn-xs btn-square btn-plain tooltip" data-tip="加入编辑" aria-label="加入编辑" @click="addToEdit(part.url, 'image-' + part.index + '.png', message.image_turn)"><ui-icon name="image-plus" class="icon-sm"></ui-icon></button>
                                  <a class="btn btn-ghost btn-xs btn-square btn-plain tooltip" data-tip="下载" aria-label="下载" :href="part.url" :download="'image-' + part.index + '.png'"><ui-icon name="download" class="icon-sm"></ui-icon></a>
                                </div>
                              </template>
                              <button type="button" class="btn btn-ghost btn-xs btn-square btn-plain tooltip text-danger" data-tip="重新生成这一张" aria-label="重新生成这一张" x-show="part.status === 'error' && message.image_turn" @click="retryTask(index, part, message.image_turn)"><ui-icon name="rotate-ccw" class="icon-sm"></ui-icon></button>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>

                    <div class="chat-tasks" x-show="parts(message, 'image_url').length">
                      <template x-for="(part, imageIndex) in parts(message, 'image_url')" :key="imageIndex">
                        <button type="button" class="chat-zoom chat-task" @click="lightbox(parts(message, 'image_url').map((item) => ({ src: item.image_url.url })), imageIndex)"><img class="chat-result-image" :src="part.image_url.url" alt="" loading="lazy"></button>
                      </template>
                    </div>

                    <div class="markdown chat-markdown" x-show="text(message)" x-html="$md(text(message))"></div>
                  </div>
                </template>
              </div>
            </template>
            <div class="chat-msg assistant" x-show="waiting"><span class="loading loading-dots loading-sm text-muted"></span></div>
          </div>
        </div>

        <div class="chat-dock" :class="{ 'chat-dock-center': !messages.length }">
          <div class="chat-hero" x-show="!messages.length">
            <h1 class="chat-hero-title" x-text="{ chat: '今天想聊点什么？', image: '把想法变成画面', voice: '文字与语音互转' }[mode]"></h1>
            <p class="chat-hero-sub" x-text="{ chat: '提问、联网搜索，或上传图片一起提问', image: '描述想要的画面，也可以加入参考图进行修改', voice: '合成自然语音，或把音频转写成文字' }[mode]"></p>
          </div>

          <div role="alert" class="alert alert-soft alert-error" x-show="error" x-cloak>
            <ui-icon name="circle-x"></ui-icon><span class="grow" x-text="error"></span>
            <button type="button" class="btn btn-ghost btn-xs btn-square" aria-label="关闭" @click="error = ''"><ui-icon name="x" class="icon-sm"></ui-icon></button>
          </div>

          <div class="composer">
            <div class="vstack vstack-xs composer-refs" x-show="mode !== 'voice'">
              <div class="composer-chips">
                <label class="composer-add" aria-label="添加参考素材">
                  <ui-icon name="plus"></ui-icon>
                  <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden @change="addImages($event.target.files); $event.target.value = ''">
                </label>
                <template x-for="image in images" :key="image.id">
                <div class="composer-chip">
                  <img :src="image.url" :alt="image.name">
                  <button type="button" :aria-label="'移除 ' + image.name" @click="images = images.filter((item) => item.id !== image.id)"><ui-icon name="x" class="icon-sm"></ui-icon></button>
                </div>
                </template>
              </div>
              <span class="text-xs text-muted">参考素材 <span class="num" x-text="images.length"></span> 个</span>
            </div>

            <template x-if="type === 'transcription'">
              <div class="row row-wrap composer-audio">
                <label class="btn btn-sm">
                  <ui-icon name="upload" class="icon-sm"></ui-icon>选择音频
                  <input type="file" accept="audio/*" hidden @change="pickAudio($event)">
                </label>
                <button type="button" class="btn btn-sm" x-show="!recording" :disabled="loading" @click="startRecording()"><ui-icon name="mic" class="icon-sm"></ui-icon>开始录音</button>
                <button type="button" class="btn btn-sm btn-error btn-soft" x-show="recording" x-cloak @click="stopRecording()"><ui-icon name="circle-stop" class="icon-sm"></ui-icon>停止录音</button>
                <span class="text-xs text-muted truncate" x-show="audio" x-text="audio && audio.name + ' · ' + $bytes(audio.size)"></span>
                <span class="tooltip tooltip-right field-help" x-show="!audio" data-tip="支持 mp3、wav、m4a、ogg、flac、webm"><ui-icon name="info" class="icon-sm"></ui-icon></span>
              </div>
            </template>

            <textarea class="composer-input" rows="4" aria-label="提示词" :placeholder="placeholder" x-model="input" x-show="type !== 'transcription'" :maxlength="type === 'speech' ? 4000 : null"
                      @keydown.enter="!$event.shiftKey && !$event.isComposing && ($event.preventDefault(), send())"
                      @paste="paste($event)"></textarea>

            <div class="row composer-foot">
              <div class="row row-xs row-wrap grow">
                <div class="tabs tabs-box tabs-sm" role="tablist" aria-label="创作模式">
                  <template x-for="item in modes" :key="item.value">
                    <button type="button" role="tab" class="tab" :class="{ 'tab-active': mode === item.value }" :disabled="recording" @click="setMode(item.value)"><ui-icon :name="item.icon" class="icon-sm"></ui-icon><span x-text="item.label"></span></button>
                  </template>
                </div>


                <template x-if="mode === 'chat'">
                  <div class="row row-xs row-wrap">
                    <ui-select variant="ghost" icon="openai" aria-label="模型" x-model="model">
                      <template x-for="item in models" :key="item"><option :value="item" x-text="item"></option></template>
                    </ui-select>
                    <ui-select variant="ghost" aria-label="思考强度" placeholder="默认思考" x-model="effort">
                      <template x-for="[value, label] in efforts" :key="value"><option :value="value" x-text="label"></option></template>
                    </ui-select>
                    <button type="button" class="btn btn-xs" :class="webSearch ? 'btn-primary' : 'btn-ghost'" :aria-pressed="webSearch" :disabled="loading" @click="webSearch = !webSearch"><ui-icon name="globe" class="icon-sm"></ui-icon>联网搜索</button>
                  </div>
                </template>

                <template x-if="mode === 'image'">
                  <div class="row row-xs row-wrap">
                    <ui-select variant="ghost" icon="openai" aria-label="模型" x-model="model">
                      <template x-for="item in imageModels" :key="item"><option :value="item" x-text="item"></option></template>
                    </ui-select>
                    <div class="chat-pop-wrap" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
                      <button type="button" class="btn btn-ghost btn-xs" :aria-expanded="open" @click="open = !open"><ui-icon name="sliders-horizontal" class="icon-sm"></ui-icon><span x-text="settingsLabel"></span></button>
                      <div class="chat-pop vstack" x-show="open" x-cloak x-transition.opacity>
                        <div class="chat-pop-row">
                          <span class="field-label">数量</span>
                          <div class="tabs tabs-box tabs-sm" role="tablist">
                            <template x-for="count in 8" :key="count">
                              <button type="button" role="tab" class="tab" :class="{ 'tab-active': settings.count === count }" x-text="count" @click="settings.count = count"></button>
                            </template>
                          </div>
                        </div>
                        <div class="vstack vstack-sm">
                          <span class="field-label">宽高比</span>
                          <div class="chat-options">
                            <template x-for="item in ratios" :key="item[0]">
                              <button type="button" class="btn btn-ghost chat-ratio" :class="{ 'chat-ratio-active': settings.ratio === item[0] }" @click="setRatio(item[0])">
                                <span class="chat-ratio-box">
                                  <ui-icon name="image" class="icon-sm" x-show="item[0] === 'auto'"></ui-icon>
                                  <span class="chat-ratio-shape" x-show="item[0] !== 'auto'" :style="{ aspectRatio: item[1] + '/' + item[2], [item[1] >= item[2] ? 'width' : 'height']: '100%' }"></span>
                                </span>
                                <span x-text="item[0]"></span>
                              </button>
                            </template>
                          </div>
                        </div>
                      </div>
                    </div>
                    <span class="row row-xs text-xs text-muted tooltip" data-tip="可用账号的剩余生图额度" x-show="$store.app.admin"><ui-icon name="coins" class="icon-sm"></ui-icon>剩余 <span class="num" x-text="quota === null ? '—' : $num(quota)"></span></span>
                  </div>
                </template>

                <template x-if="mode === 'voice'">
                  <div class="row row-xs row-wrap">
                    <div class="tabs tabs-box tabs-sm" role="tablist" aria-label="语音类型">
                      <button type="button" role="tab" class="tab" :class="{ 'tab-active': type === 'speech' }" :disabled="recording" @click="setType('speech')">合成</button>
                      <button type="button" role="tab" class="tab" :class="{ 'tab-active': type === 'transcription' }" :disabled="recording" @click="setType('transcription')">转写</button>
                    </div>
                    <ui-select variant="ghost" aria-label="音色" x-model="voice" x-show="type === 'speech'">
                      <template x-for="[value, label] in voices" :key="value"><option :value="value" x-text="label"></option></template>
                    </ui-select>
                    <ui-select variant="ghost" aria-label="格式" x-model="format" x-show="type === 'speech'">
                      <template x-for="[value, label] in formats" :key="value"><option :value="value" x-text="label"></option></template>
                    </ui-select>
                  </div>
                </template>
              </div>
              <button type="button" class="btn btn-primary btn-sm btn-circle" aria-label="提交" :disabled="!canSend" @click="send()">
                <span class="loading loading-spinner loading-xs" x-show="loading"></span>
                <ui-icon name="arrow-up" x-show="!loading"></ui-icon>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </template>

  <template id="page-accounts">
    <div class="page" x-data="accounts">
      <div class="page-head">
        <h1 class="title-page">号池</h1>
        <div class="row" x-show="tab === 'accounts'">
          <button type="button" class="btn btn-sm" @click="loadModels()"><ui-icon name="list-tree" class="icon-sm"></ui-icon>可用模型</button>
          <button type="button" class="btn btn-sm" :disabled="busy === 'quota' || !summary?.total" @click="queryAll()"><ui-icon name="coins" class="icon-sm" x-show="busy !== 'quota'"></ui-icon><span class="loading loading-spinner loading-xs" x-show="busy === 'quota'"></span>查询全部额度</button>
          <button type="button" class="btn btn-sm" :disabled="loading" @click="loadAccounts()"><ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: loading }"></ui-icon>刷新</button>
          <button type="button" class="btn btn-sm btn-primary" @click="openImport()"><ui-icon name="upload" class="icon-sm"></ui-icon>导入</button>
        </div>
        <div class="row" x-show="tab !== 'accounts'" x-cloak>
          <button type="button" class="btn btn-sm btn-primary" @click="openSourceForm()"><ui-icon name="plus" class="icon-sm"></ui-icon>添加连接</button>
        </div>
      </div>

      <div class="vstack vstack-lg">
        <div class="tabs tabs-border" role="tablist">
          <button type="button" role="tab" class="tab" :class="{ 'tab-active': tab === 'accounts' }" @click="tab = 'accounts'">账号</button>
          <button type="button" role="tab" class="tab" :class="{ 'tab-active': tab === 'cpa' }" @click="tab = 'cpa'">CPA</button>
          <button type="button" role="tab" class="tab" :class="{ 'tab-active': tab === 'sub2api' }" @click="tab = 'sub2api'">Sub2API</button>
        </div>

        <!-- 账号 -->
        <template x-if="tab === 'accounts'">
          <div class="vstack vstack-lg">
            <template x-if="!summary">
              <div class="grid grid-4"><template x-for="i in 4"><div class="skeleton metric-skeleton"></div></template></div>
            </template>
            <template x-if="summary">
              <div class="grid grid-4">
                <template x-for="metric in metrics" :key="metric.label">
                  <div class="metric-tile">
                    <div class="metric-label"><span x-text="metric.label"></span><ui-icon :name="metric.icon" class="icon-sm"></ui-icon></div>
                    <div class="metric-value" x-text="$num(metric.value)"></div>
                    <div class="metric-meta" x-text="metric.meta"></div>
                  </div>
                </template>
              </div>
            </template>

            <section class="panel panel-flush">
              <div class="panel-head row-wrap">
                <div class="row row-wrap">
                  <label class="input input-sm search-input">
                    <ui-icon name="search" class="icon-sm text-subtle"></ui-icon>
                    <input type="search" placeholder="搜索邮箱" x-model.debounce.400ms="query">
                  </label>
                  <ui-select x-model="type">
                    <option value="">全部类型</option>
                    <template x-for="item in types" :key="item"><option :value="item" x-text="item"></option></template>
                  </ui-select>
                  <ui-select x-model="status">
                    <option value="">全部状态</option>
                    <template x-for="item in Object.keys(statuses)" :key="item"><option :value="item" x-text="item"></option></template>
                  </ui-select>
                </div>
                <div class="row" x-show="selected.length">
                  <span class="text-muted num">已选 <span x-text="selected.length"></span> 项</span>
                  <button type="button" class="btn btn-sm btn-ghost" @click="selected = []">取消选择</button>
                  <button type="button" class="btn btn-sm btn-error btn-soft" :disabled="busy === 'delete'" @click="remove(selected, `删除所选 ${selected.length} 个账号`)"><ui-icon name="trash-2" class="icon-sm"></ui-icon>删除所选</button>
                </div>
                <button type="button" class="btn btn-sm btn-error btn-soft tooltip tooltip-left" data-tip="删除当前页状态为异常的账号" x-show="!selected.length" :disabled="!abnormal.length || busy === 'delete'" @click="remove(abnormal.map((item) => item.access_token), `移除当前页 ${abnormal.length} 个异常账号`)"><ui-icon name="trash-2" class="icon-sm"></ui-icon>移除异常账号</button>
              </div>
              <div class="table-wrap">
                <table class="table table-sm">
                  <thead>
                    <tr>
                      <th class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="全选当前页" :checked="allSelected" @change="selected = $event.target.checked ? items.map((item) => item.access_token) : []"></th>
                      <th>邮箱</th><th class="text-center">类型</th><th class="text-center">线路</th><th class="text-center">状态</th><th class="text-center">额度</th>
                      <th class="text-center"><span class="row row-xs row-center">调用<span class="tooltip tooltip-bottom field-help" data-tip="进行中 / 成功 / 失败；空闲时进行中持续大于 0 说明有任务未正常结束"><ui-icon name="info" class="icon-sm"></ui-icon></span></span></th>
                      <th class="text-center">创建时间</th>
                      <th class="col-actions">操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="item in items" :key="item.access_token">
                      <tr>
                        <td class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="选择" :value="item.access_token" x-model="selected"></td>
                        <td class="text-strong" x-text="item.email || '—'"></td>
                        <td class="text-center"><span class="badge badge-sm badge-soft badge-info" x-text="item.type"></span></td>
                        <td class="text-center"><span class="row row-xs row-center"><span class="badge badge-sm badge-soft" x-show="item.is_codex">Codex</span><span class="badge badge-sm badge-soft">Web</span></span></td>
                        <td class="text-center"><span class="badge badge-sm badge-soft" :class="statuses[item.status]" x-text="item.status"></span></td>
                        <td class="text-center nowrap"><span class="num" x-text="$num(Math.max(0, item.remaining))"></span> <span class="text-xs text-muted tooltip" :data-tip="$time(item.reset_after)" x-text="resetText(item.reset_after)"></span></td>
                        <td class="text-center num nowrap"><span :class="item.image_inflight ? 'text-warning text-strong' : 'text-subtle'" x-text="item.image_inflight"></span> / <span x-text="$num(item.success)"></span> / <span x-text="$num(item.fail)"></span></td>
                        <td class="text-center num text-muted nowrap" x-text="$time(item.created_at)"></td>
                        <td class="col-actions">
                          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="详情" aria-label="详情" @click="detail = item; detailTab = 'info'"><ui-icon name="eye" class="icon-sm"></ui-icon></button>
                          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="刷新额度" aria-label="刷新额度" :disabled="busy === 'quota' || busy === item.access_token" @click="refreshQuota(item)"><ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: busy === item.access_token }"></ui-icon></button>
                          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="编辑" aria-label="编辑" @click="openEdit(item)"><ui-icon name="pencil" class="icon-sm"></ui-icon></button>
                          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip text-danger" data-tip="删除" aria-label="删除" @click="remove([item.access_token], '删除这个账号')"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div class="center-fill" x-show="loading && !items.length"><span class="loading loading-spinner loading-sm"></span></div>
              <div class="empty" x-show="!loading && !items.length"><ui-icon name="users-round"></ui-icon><span x-text="query || type || status ? '没有匹配的账号' : '号池中还没有账号'"></span></div>
              <ui-pager x-show="total > 10" :page="page" :size="size" :total="total" @change="page = $event.detail.page; size = $event.detail.size; loadAccounts()"></ui-pager>
            </section>
          </div>
        </template>

        <!-- CPA / Sub2API 连接 -->
        <template x-if="tab !== 'accounts'">
          <section class="panel panel-flush">
            <div class="table-wrap">
              <table class="table table-sm">
                <thead>
                  <tr>
                    <th>连接</th>
                    <template x-if="tab === 'sub2api'"><th>登录方式</th></template>
                    <template x-if="tab === 'sub2api'"><th>分组</th></template>
                    <th>最近导入</th><th class="col-actions">操作</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="item in sources ?? []" :key="item.id">
                    <tr>
                      <td>
                        <div class="text-strong" x-text="item.name || item.base_url"></div>
                        <div class="text-xs text-muted" x-text="item.base_url"></div>
                      </td>
                      <template x-if="tab === 'sub2api'"><td x-text="item.email || (item.has_api_key ? 'API Key' : '—')"></td></template>
                      <template x-if="tab === 'sub2api'"><td x-text="item.group_id || '全部分组'"></td></template>
                      <td>
                        <span class="text-subtle" x-show="!item.import_job">—</span>
                        <template x-if="item.import_job">
                          <div class="vstack vstack-xs">
                            <div class="row">
                              <span class="badge badge-sm badge-soft" :class="jobStatus[item.import_job.status][1]" x-text="jobStatus[item.import_job.status][0]"></span>
                              <span class="num text-muted" x-text="`${item.import_job.completed} / ${item.import_job.total}`"></span>
                              <span class="text-xs text-subtle num" x-text="$short(item.import_job.created_at)"></span>
                            </div>
                            <progress class="progress" :class="item.import_job.status === 'failed' ? 'progress-error' : 'progress-neutral'" :value="progress(item.import_job)" max="100"></progress>
                            <div class="text-xs text-muted num" x-text="`新增 ${item.import_job.added} · 跳过 ${item.import_job.skipped} · 刷新 ${item.import_job.refreshed} · 失败 ${item.import_job.failed}`"></div>
                            <div class="text-xs text-danger break-all" x-show="item.import_job.errors.length" x-text="item.import_job.errors[0]?.error"></div>
                          </div>
                        </template>
                      </td>
                      <td class="col-actions">
                        <button type="button" class="btn btn-ghost btn-sm" :disabled="syncing === item.id" @click="browse(item)"><span class="loading loading-spinner loading-xs" x-show="syncing === item.id"></span><ui-icon name="download" class="icon-sm" x-show="syncing !== item.id"></ui-icon>选择导入</button>
                        <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="编辑" aria-label="编辑" @click="openSourceForm(item)"><ui-icon name="pencil" class="icon-sm"></ui-icon></button>
                        <button type="button" class="btn btn-ghost btn-sm btn-square tooltip text-danger" data-tip="删除" aria-label="删除" @click="removeSource(item)"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div class="center-fill" x-show="!sources"><span class="loading loading-spinner loading-sm"></span></div>
            <div class="empty" x-show="sources && !sources.length"><ui-icon name="server-cog"></ui-icon><span x-text="tab === 'cpa' ? '还没有 CPA 连接' : '还没有 Sub2API 连接'"></span></div>
          </section>
        </template>
      </div>

      <!-- 可用模型 -->
      <dialog class="modal" x-effect="models.open ? $el.showModal() : $el.close()" @close="models.open = false">
        <div class="modal-box">
          <div class="row row-between modal-title">
            <span>可用模型</span>
            <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-left" data-tip="重新获取" aria-label="重新获取" :disabled="models.loading" @click="loadModels(true)"><ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: models.loading }"></ui-icon></button>
          </div>
          <div class="center-fill" x-show="models.loading && !models.items.length"><span class="loading loading-spinner loading-sm"></span></div>
          <div class="empty" x-show="!models.loading && !models.items.length"><ui-icon name="list-tree"></ui-icon>暂无可用模型</div>
          <div class="row row-wrap" x-show="models.items.length">
            <template x-for="model in models.items" :key="model.id">
              <ui-model :name="model.id"></ui-model>
            </template>
          </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>

      <!-- 账号详情 -->
      <dialog class="modal" x-effect="detail ? $el.showModal() : $el.close()" @close="detail = null">
        <div class="modal-box modal-wide">
          <template x-if="detail">
            <div class="vstack">
              <div class="modal-head">
                <h3 class="modal-title truncate" x-text="detail.email || '账号详情'"></h3>
                <div class="tabs tabs-box tabs-sm" role="tablist">
                  <button type="button" role="tab" class="tab" :class="{ 'tab-active': detailTab === 'info' }" @click="detailTab = 'info'">概况</button>
                  <button type="button" role="tab" class="tab" :class="{ 'tab-active': detailTab === 'token' }" @click="detailTab = 'token'">凭证</button>
                </div>
                <button type="button" class="btn btn-ghost btn-sm btn-square" aria-label="关闭" @click="detail = null"><ui-icon name="x" class="icon-sm"></ui-icon></button>
              </div>
              <dl class="kv" x-show="detailTab === 'info'">
                <dt>用户 ID</dt><dd><span class="mono copyable" x-show="detail.user_id" x-text="detail.user_id" @click="$copy(detail.user_id)"></span><span x-show="!detail.user_id">—</span></dd>
                <dt>账号 ID</dt><dd><span class="mono copyable" x-show="detail.account_id" x-text="detail.account_id" @click="$copy(detail.account_id)"></span><span x-show="!detail.account_id">—</span></dd>
                <dt>类型</dt><dd><span class="badge badge-sm badge-soft badge-info" x-text="detail.type"></span></dd>
                <dt>线路</dt><dd class="row row-xs"><span class="badge badge-sm badge-soft" x-show="detail.is_codex">Codex</span><span class="badge badge-sm badge-soft">Web</span></dd>
                <dt>状态</dt><dd><span class="badge badge-sm badge-soft" :class="statuses[detail.status]" x-text="detail.status"></span></dd>
                <dt>账号代理</dt><dd x-text="detail.proxy || '使用全局代理'"></dd>
                <dt>额度</dt><dd class="num" x-text="`剩余 ${Math.max(0, detail.remaining)} / 总计 ${Math.max(0, detail.quota)}`"></dd>
                <dt>调用</dt><dd class="num" x-text="`成功 ${detail.success} · 失败 ${detail.fail} · 进行中 ${detail.image_inflight}`"></dd>
                <dt>恢复时间</dt><dd class="num" x-text="$time(detail.reset_after)"></dd>
                <dt>最后使用</dt><dd class="num" x-text="$time(detail.last_used_at)"></dd>
                <dt>最后刷新</dt><dd class="num" x-text="$time(detail.last_refresh_at)"></dd>
                <dt>创建时间</dt><dd class="num" x-text="$time(detail.created_at)"></dd>
                <dt>最后错误</dt><dd :class="{ 'text-danger': detail.last_error }" x-text="detail.last_error || '—'"></dd>
              </dl>
              <dl class="kv" x-show="detailTab === 'token'">
                <dt>Access Token</dt><dd><span class="mono copyable" title="点击复制" x-text="mask(detail.access_token)" @click="$copy(detail.access_token)"></span></dd>
                <dt>Refresh Token</dt><dd><span class="mono copyable" title="点击复制" x-show="detail.refresh_token" x-text="mask(detail.refresh_token)" @click="$copy(detail.refresh_token)"></span><span x-show="!detail.refresh_token">—</span></dd>
                <dt>ID Token</dt><dd><span class="mono copyable" title="点击复制" x-show="detail.id_token" x-text="mask(detail.id_token)" @click="$copy(detail.id_token)"></span><span x-show="!detail.id_token">—</span></dd>
              </dl>
            </div>
          </template>
        </div>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>

      <!-- 编辑账号 -->
      <dialog class="modal" x-effect="edit.open ? $el.showModal() : $el.close()" @close="edit.open = false">
        <form class="modal-box vstack" @submit.prevent="saveEdit()">
          <h3 class="modal-title">编辑账号</h3>
          <div class="field">
            <span class="field-label">状态</span>
            <ui-select class="block" x-model="edit.status">
              <template x-for="item in Object.keys(statuses)" :key="item"><option :value="item" x-text="item"></option></template>
            </ui-select>
          </div>
          <div class="field">
            <label class="field-label" for="account-proxy">账号代理<span class="tooltip field-help" data-tip="留空时使用全局代理"><ui-icon name="info" class="icon-sm"></ui-icon></span></label>
            <div class="input-group">
              <input id="account-proxy" class="input input-sm mono" x-model="edit.proxy" placeholder="http://127.0.0.1:7890">
              <button type="button" class="btn btn-sm" :disabled="!edit.proxy || edit.testing" @click="testProxy()"><span class="loading loading-spinner loading-xs" x-show="edit.testing"></span><ui-icon name="plug-zap" class="icon-sm" x-show="!edit.testing"></ui-icon>测试</button>
            </div>
          </div>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="edit.open = false">取消</button>
            <button type="submit" class="btn btn-sm btn-primary" :disabled="edit.saving"><span class="loading loading-spinner loading-xs" x-show="edit.saving"></span>保存</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>

      <!-- 导入账号 -->
      <dialog class="modal" x-effect="imp.open ? $el.showModal() : $el.close()" @close="imp.open = false">
        <div class="modal-box vstack">
          <div class="row modal-title">
            <button type="button" class="btn btn-ghost btn-sm btn-square" aria-label="返回导入方式" x-show="imp.method !== 'menu'" @click="imp.method = 'menu'"><ui-icon name="arrow-left" class="icon-sm"></ui-icon></button>
            <span x-text="importTitle"></span>
          </div>

          <div class="vstack vstack-sm" x-show="imp.method === 'menu'">
            <template x-for="option in [
              { method: 'oauth', icon: 'log-in', title: '登录已有账号', text: '在浏览器登录 ChatGPT 账号，导入后自动续期' },
              { method: 'token', icon: 'key-round', title: 'Access Token', text: '粘贴或从 TXT 文件读取，每行一个' },
              { method: 'session', icon: 'file-json', title: 'Session JSON', text: '从 chatgpt.com 复制完整的登录信息' },
              { method: 'codex', icon: 'file-json', title: 'Codex 认证 JSON', text: '导入后标记为 Codex 账号' },
              { method: 'files', icon: 'files', title: '账号 JSON 文件', text: '支持单个账号、账号数组和 CPA 文件，可多选' },
              { method: 'cpa', icon: 'cloud', title: '从 CPA 导入', text: '从已连接的 CPA 服务选择账号' },
              { method: 'sub2api', icon: 'server-cog', title: '从 Sub2API 导入', text: '从已连接的 Sub2API 服务选择账号' },
            ]" :key="option.method">
              <button type="button" class="option-card" @click="['cpa', 'sub2api'].includes(option.method) ? gotoSource(option.method) : imp.method = option.method">
                <ui-icon :name="option.icon"></ui-icon>
                <span class="vstack vstack-xs grow">
                  <span class="text-strong" x-text="option.title"></span>
                  <span class="text-xs text-muted" x-text="option.text"></span>
                </span>
                <ui-icon name="chevron-right" class="icon-sm text-subtle"></ui-icon>
              </button>
            </template>
          </div>

          <template x-if="imp.method === 'oauth'">
            <div class="vstack">
              <div class="field">
                <label class="field-label" for="oauth-email">邮箱<span class="tooltip field-help" data-tip="选填，登录页会预先填入"><ui-icon name="info" class="icon-sm"></ui-icon></span></label>
                <input id="oauth-email" type="email" class="input input-sm" x-model="imp.email" placeholder="you@example.com" :disabled="imp.oauth || imp.starting">
              </div>
              <button type="button" class="btn btn-sm btn-primary" x-show="!imp.oauth" :disabled="imp.starting" @click="startOAuth()"><span class="loading loading-spinner loading-xs" x-show="imp.starting"></span><ui-icon name="external-link" class="icon-sm" x-show="!imp.starting"></ui-icon>打开授权页面</button>
              <template x-if="imp.oauth">
                <div class="vstack">
                  <div class="field">
                    <span class="field-label">授权地址</span>
                    <span class="mono copyable break-all" title="点击复制" x-text="imp.oauth.authorize_url" @click="$copy(imp.oauth.authorize_url)"></span>
                    <div class="row">
                      <a class="btn btn-sm" :href="imp.oauth.authorize_url" target="_blank" rel="noreferrer"><ui-icon name="external-link" class="icon-sm"></ui-icon>再次打开</a>
                      <button type="button" class="btn btn-sm" @click="imp.oauth = null; imp.callback = ''"><ui-icon name="rotate-ccw" class="icon-sm"></ui-icon>重新生成</button>
                    </div>
                  </div>
                  <div class="field">
                    <label class="field-label" for="oauth-callback">回调地址<span class="tooltip field-help" data-tip="登录完成后浏览器跳转到 platform.openai.com/auth/callback?code=…，复制地址栏中的完整地址；也可只填 code"><ui-icon name="info" class="icon-sm"></ui-icon></span></label>
                    <textarea id="oauth-callback" class="textarea textarea-sm mono" rows="3" x-model="imp.callback" placeholder="https://platform.openai.com/auth/callback?code=...&state=..."></textarea>
                  </div>
                </div>
              </template>
              <div role="alert" class="alert alert-soft alert-warning">
                <ui-icon name="triangle-alert"></ui-icon><span>授权码只能使用一次，需在 10 分钟内完成。如果回调页显示错误，请重新生成后再登录。</span>
              </div>
            </div>
          </template>

          <template x-if="imp.method === 'token'">
            <div class="field">
              <div class="row row-between">
                <label class="field-label" for="import-tokens">Access Token<span class="text-subtle num" x-text="`已识别 ${tokenList.length} 个`"></span></label>
                <button type="button" class="btn btn-ghost btn-xs" @click="$refs.txt.click()"><ui-icon name="file-text" class="icon-sm"></ui-icon>读取 TXT</button>
              </div>
              <textarea id="import-tokens" class="textarea textarea-sm mono" rows="10" x-model="imp.tokens" placeholder="每行一个 Access Token"></textarea>
              <input type="file" accept=".txt,text/plain" hidden x-ref="txt" @change="readTxt($event)">
            </div>
          </template>

          <template x-if="imp.method === 'session'">
            <div class="vstack">
              <div role="alert" class="alert alert-soft alert-warning">
                <ui-icon name="triangle-alert"></ui-icon><span>请使用不常用的小号导入，避免主力账号被封禁。</span>
              </div>
              <div class="field">
                <div class="row row-between">
                  <label class="field-label" for="import-session">Session JSON</label>
                  <a class="btn btn-ghost btn-xs" href="https://chatgpt.com/api/auth/session" target="_blank" rel="noreferrer">获取页面<ui-icon name="external-link" class="icon-sm"></ui-icon></a>
                </div>
                <textarea id="import-session" class="textarea textarea-sm mono" rows="10" x-model="imp.session" placeholder='粘贴页面返回的完整内容，需包含 "accessToken"'></textarea>
              </div>
            </div>
          </template>

          <template x-if="imp.method === 'codex'">
            <div class="field">
              <label class="field-label" for="import-codex">Codex 认证 JSON</label>
              <textarea id="import-codex" class="textarea textarea-sm mono" rows="12" x-model="imp.codex" placeholder='包含 "access_token"、"refresh_token"、"id_token" 的内容'></textarea>
            </div>
          </template>

          <template x-if="imp.method === 'files'">
            <div class="empty">
              <ui-icon name="files"></ui-icon>
              <span>选择一个或多个账号 JSON 文件，导入前会确认数量</span>
              <button type="button" class="btn btn-sm btn-primary" :disabled="imp.submitting" @click="$refs.json.click()"><span class="loading loading-spinner loading-xs" x-show="imp.submitting"></span>选择文件</button>
              <input type="file" accept=".json,application/json" multiple hidden x-ref="json" @change="readJsonFiles($event)">
            </div>
          </template>

          <div class="modal-action" x-show="['oauth', 'token', 'session', 'codex'].includes(imp.method)">
            <button type="button" class="btn btn-sm" @click="imp.open = false">取消</button>
            <button type="button" class="btn btn-sm btn-primary" :disabled="imp.submitting || (imp.method === 'oauth' ? !imp.callback : imp.method === 'token' ? !tokenList.length : !imp[imp.method])" @click="importTyped()"><span class="loading loading-spinner loading-xs" x-show="imp.submitting"></span>导入</button>
          </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>

      <!-- CPA 连接 -->
      <dialog class="modal" x-effect="poolForm.open ? $el.showModal() : $el.close()" @close="poolForm.open = false">
        <form class="modal-box vstack" @submit.prevent="savePool()">
          <h3 class="modal-title" x-text="poolForm.id ? '编辑 CPA 连接' : '添加 CPA 连接'"></h3>
          <div class="field">
            <label class="field-label" for="pool-name">名称</label>
            <input id="pool-name" class="input input-sm" x-model="poolForm.name" placeholder="选填，例如主号池">
          </div>
          <div class="field">
            <label class="field-label" for="pool-url">服务地址</label>
            <input id="pool-url" class="input input-sm mono" x-model="poolForm.base_url" placeholder="http://your-cpa-host:8317">
          </div>
          <div class="field">
            <label class="field-label" for="pool-secret">管理密钥</label>
            <label class="input input-sm">
              <input id="pool-secret" class="grow mono" :type="poolForm.show ? 'text' : 'password'" x-model="poolForm.secret" :placeholder="poolForm.id ? '留空则不修改' : 'CPA 管理密钥'">
              <button type="button" class="btn btn-ghost btn-xs btn-square" :aria-label="poolForm.show ? '隐藏' : '显示'" @click="poolForm.show = !poolForm.show"><ui-icon :name="poolForm.show ? 'eye-off' : 'eye'" class="icon-sm"></ui-icon></button>
            </label>
          </div>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="poolForm.open = false">取消</button>
            <button type="submit" class="btn btn-sm btn-primary" :disabled="!poolForm.base_url || (!poolForm.id && !poolForm.secret) || poolForm.saving"><span class="loading loading-spinner loading-xs" x-show="poolForm.saving"></span>保存</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>

      <!-- Sub2API 连接 -->
      <dialog class="modal" x-effect="serverForm.open ? $el.showModal() : $el.close()" @close="serverForm.open = false">
        <form class="modal-box vstack" @submit.prevent="saveServer()">
          <h3 class="modal-title" x-text="serverForm.id ? '编辑 Sub2API 连接' : '添加 Sub2API 连接'"></h3>
          <template x-if="serverForm.open">
            <div class="vstack">
              <div class="field">
                <label class="field-label" for="server-name">名称</label>
                <input id="server-name" class="input input-sm" x-model="serverForm.name" placeholder="选填，例如自建服务">
              </div>
              <div class="field">
                <label class="field-label" for="server-url">服务地址</label>
                <input id="server-url" class="input input-sm mono" x-model="serverForm.base_url" placeholder="http://your-sub2api-host:8080">
              </div>
              <div class="field">
                <span class="field-label">登录方式</span>
                <ui-select class="block" x-model="serverForm.auth">
                  <option value="password">管理员邮箱和密码</option>
                  <option value="api_key">管理员 API Key</option>
                </ui-select>
              </div>
              <template x-if="serverForm.auth === 'password'">
                <div class="field">
                  <label class="field-label" for="server-email">管理员邮箱</label>
                  <input id="server-email" type="email" class="input input-sm" x-model="serverForm.email" placeholder="admin@example.com">
                </div>
              </template>
              <div class="field">
                <label class="field-label" for="server-secret" x-text="serverForm.auth === 'password' ? '管理员密码' : '管理员 API Key'"></label>
                <label class="input input-sm">
                  <input id="server-secret" class="grow mono" :type="serverForm.show ? 'text' : 'password'" x-model="serverForm[serverForm.auth]" :placeholder="serverForm.id ? '留空则不修改' : ''">
                  <button type="button" class="btn btn-ghost btn-xs btn-square" :aria-label="serverForm.show ? '隐藏' : '显示'" @click="serverForm.show = !serverForm.show"><ui-icon :name="serverForm.show ? 'eye-off' : 'eye'" class="icon-sm"></ui-icon></button>
                </label>
              </div>
              <div class="field">
                <div class="row row-between">
                  <label class="field-label" for="server-group">分组<span class="tooltip field-help" data-tip="只同步该分组的 OpenAI 账号；留空同步全部，ungrouped 表示未分组。保存连接后可读取分组列表"><ui-icon name="info" class="icon-sm"></ui-icon></span></label>
                  <button type="button" class="btn btn-ghost btn-xs" x-show="serverForm.id" :disabled="serverForm.loadingGroups" @click="loadGroups()"><ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: serverForm.loadingGroups }"></ui-icon>读取分组</button>
                </div>
                <input id="server-group" class="input input-sm mono" x-show="!serverForm.groups" x-model="serverForm.group_id" placeholder="留空同步全部分组">
                <template x-if="serverForm.groups">
                  <ui-select class="block" x-model="serverForm.group_id">
                    <option value="">全部分组</option>
                    <option value="ungrouped">未分组</option>
                    <template x-for="group in serverForm.groups" :key="group.id"><option :value="group.id" x-text="groupLabel(group)"></option></template>
                  </ui-select>
                </template>
              </div>
            </div>
          </template>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="serverForm.open = false">取消</button>
            <button type="submit" class="btn btn-sm btn-primary" :disabled="serverForm.saving || !serverForm.base_url || (serverForm.auth === 'password' ? !serverForm.email || (!serverForm.id && !serverForm.password) : !serverForm.id && !serverForm.api_key)"><span class="loading loading-spinner loading-xs" x-show="serverForm.saving"></span>保存</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>

      <!-- 选择远程账号 -->
      <dialog class="modal" x-effect="browser.open ? $el.showModal() : $el.close()" @close="browser.open = false">
        <div class="modal-box modal-wide vstack">
          <div class="modal-title">
            <div>选择要导入的账号</div>
            <div class="text-xs text-muted" x-text="browser.source && (browser.source.name || browser.source.base_url)"></div>
          </div>
          <div class="row row-between row-wrap">
            <label class="input input-sm search-input">
              <ui-icon name="search" class="icon-sm text-subtle"></ui-icon>
              <input type="search" :placeholder="browser.kind === 'cpa' ? '搜索邮箱或文件名' : '搜索邮箱、名称或套餐'" x-model="browser.query" @input.debounce.300ms="browser.page = 1; reloadBrowser()">
            </label>
            <span class="text-muted num" x-text="`共 ${browserTotal} 个 · 已选 ${browser.selected.length} 个`"></span>
          </div>
          <div class="table-wrap">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="全选本页" :checked="browserAll" @change="toggleBrowserAll()"></th>
                  <th>账号</th>
                  <template x-if="browser.kind === 'sub2api'"><th>套餐</th></template>
                  <template x-if="browser.kind === 'sub2api'"><th>状态</th></template>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in browserPage" :key="row.key">
                  <tr>
                    <td class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="选择" :value="row.key" x-model="browser.selected"></td>
                    <td>
                      <div class="text-strong" x-text="row.title"></div>
                      <div class="text-xs text-muted break-all" x-text="row.meta"></div>
                    </td>
                    <template x-if="browser.kind === 'sub2api'"><td><span class="badge badge-sm badge-soft" x-show="row.plan" x-text="row.plan"></span></td></template>
                    <template x-if="browser.kind === 'sub2api'"><td><span class="badge badge-sm badge-soft" :class="{ 'badge-success': row.status === 'active' }" x-show="row.status" x-text="row.status"></span></td></template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="empty" x-show="!browserRows.length"><ui-icon name="search"></ui-icon><span x-text="browser.query ? '没有匹配的账号' : '对方服务中没有可导入的账号'"></span></div>
          <ui-pager x-show="browserTotal > 20" :page="browser.page" :size="browser.size" :total="browserTotal" sizes="20,50,100,200" @change="browser.page = $event.detail.page; browser.size = $event.detail.size; reloadBrowser()"></ui-pager>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="browser.open = false">取消</button>
            <button type="button" class="btn btn-sm" x-show="browser.kind === 'sub2api'" :disabled="!browserTotal || browser.starting" @click="startSourceImport(true)">导入全部<span class="num" x-text="browserTotal"></span></button>
            <button type="button" class="btn btn-sm btn-primary" :disabled="!browser.selected.length || browser.starting" @click="startSourceImport()"><span class="loading loading-spinner loading-xs" x-show="browser.starting"></span>导入<span class="num" x-show="browser.selected.length" x-text="browser.selected.length"></span></button>
          </div>
        </div>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>
    </div>
  </template>

  <template id="page-keys">
    <div class="page" x-data="keys">
      <div class="page-head">
        <h1 class="title-page">密钥</h1>
        <div class="row">
          <label class="input input-sm search-input">
            <ui-icon name="search" class="icon-sm text-subtle"></ui-icon>
            <input type="search" placeholder="搜索名称或密钥" x-model="query" @input="page = 1">
          </label>
          <button type="button" class="btn btn-sm btn-primary" @click="openForm()"><ui-icon name="plus" class="icon-sm"></ui-icon>新增密钥</button>
        </div>
      </div>

      <section class="panel panel-flush">
        <div class="table-wrap">
          <table class="table table-sm">
            <thead>
              <tr><th>名称</th><th>密钥</th><th>订阅等级</th><th>线路</th><th>启用</th><th>创建时间</th><th>最近使用</th><th class="col-actions">操作</th></tr>
            </thead>
            <tbody>
              <template x-for="item in paged" :key="item.id">
                <tr>
                  <td class="text-strong" x-text="item.name || '—'"></td>
                  <td><span class="mono copyable" title="点击复制" x-text="item.key" @click="$copy(item.key)"></span></td>
                  <td x-text="item.plan.map((value) => ({ free: 'Free', plus: 'Plus', team: 'Team', pro: 'Pro' })[value]).join('、')"></td>
                  <td x-text="item.route.map((value) => ({ web: 'Web', codex: 'Codex' })[value]).join('、')"></td>
                  <td><input type="checkbox" class="toggle toggle-sm" :checked="item.enabled" :aria-label="item.enabled ? '禁用' : '启用'" @change="toggle(item, $event.target.checked)"></td>
                  <td class="num text-muted nowrap" x-text="$time(item.created_at)"></td>
                  <td class="num text-muted nowrap" x-text="$time(item.last_used_at)"></td>
                  <td class="col-actions">
                    <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="编辑" aria-label="编辑" @click="openForm(item)"><ui-icon name="pencil" class="icon-sm"></ui-icon></button>
                    <button type="button" class="btn btn-ghost btn-sm btn-square tooltip text-danger" data-tip="删除" aria-label="删除" @click="remove(item)"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div class="center-fill" x-show="loading"><span class="loading loading-spinner loading-sm"></span></div>
        <div class="empty" x-show="!loading && !filtered.length"><ui-icon name="key-round"></ui-icon><span x-text="query ? '没有匹配的密钥' : '暂无用户密钥'"></span></div>
        <ui-pager x-show="filtered.length > size" :page="page" :size="size" :total="filtered.length" @change="page = $event.detail.page; size = $event.detail.size"></ui-pager>
      </section>

      <dialog class="modal" x-effect="form.open ? $el.showModal() : $el.close()" @close="form.open = false">
        <form class="modal-box vstack" @submit.prevent="save()">
          <h3 class="modal-title" x-text="form.id ? '编辑密钥' : '新增密钥'"></h3>
          <div class="field">
            <label class="field-label" for="key-name">名称</label>
            <input id="key-name" class="input input-sm" x-model="form.name" placeholder="用于区分使用者">
          </div>
          <div class="field">
            <label class="field-label" for="key-value">密钥</label>
            <input id="key-value" class="input input-sm mono" :class="{ 'input-error': form.error }" x-model="form.key" placeholder="登录与调用时使用" @input="form.error = ''">
            <span class="field-error" x-show="form.error" x-text="form.error"></span>
          </div>
          <div class="field">
            <span class="field-label">订阅等级</span>
            <ui-select class="block" multiple aria-label="订阅等级" x-model="form.plan"><option value="free">Free</option><option value="plus">Plus</option><option value="team">Team</option><option value="pro">Pro</option></ui-select>
          </div>
          <div class="field">
            <span class="field-label">线路</span>
            <ui-select class="block" multiple aria-label="线路" x-model="form.route"><option value="web">Web</option><option value="codex">Codex</option></ui-select>
          </div>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="form.open = false">取消</button>
            <button type="submit" class="btn btn-sm btn-primary" :disabled="!form.key || form.saving"><span class="loading loading-spinner loading-xs" x-show="form.saving"></span>保存</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>
    </div>
  </template>

  <template id="page-gallery">
    <div class="page" x-data="gallery">
      <div class="page-head">
        <h1 class="title-page">图库</h1>
        <div class="row row-wrap">
          <button type="button" class="btn btn-sm" :disabled="busy" @click="compress()"><span class="loading loading-spinner loading-xs" x-show="busy === 'compress'"></span><ui-icon name="archive" class="icon-sm" x-show="busy !== 'compress'"></ui-icon>压缩优化</button>
          <button type="button" class="btn btn-sm" :disabled="busy" @click="cleanup.open = true"><ui-icon name="eraser" class="icon-sm"></ui-icon>清理空间</button>
          <button type="button" class="btn btn-sm btn-error btn-soft" :disabled="busy" @click="byDate = { open: true, date: '' }"><ui-icon name="calendar-days" class="icon-sm"></ui-icon>按日期删除</button>
          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-left" data-tip="刷新" aria-label="刷新" :disabled="loading" @click="load()"><ui-icon name="refresh-cw" class="icon-sm" :class="{ spin: loading }"></ui-icon></button>
        </div>
      </div>

      <div class="vstack vstack-lg">
        <template x-if="!storage">
          <div class="grid grid-4"><template x-for="i in 4"><div class="skeleton metric-skeleton"></div></template></div>
        </template>
        <template x-if="storage">
          <div class="grid grid-4">
            <div class="metric-tile">
              <div class="metric-label"><span>磁盘总量</span><ui-icon name="hard-drive" class="icon-sm"></ui-icon></div>
              <div class="metric-value" x-text="$bytes(storage.disk_total_mb * 1048576)"></div>
              <div class="metric-meta" x-text="'已用 ' + $bytes(storage.disk_used_mb * 1048576)"></div>
            </div>
            <div class="metric-tile">
              <div class="metric-label"><span>剩余空间</span><ui-icon name="gauge" class="icon-sm"></ui-icon></div>
              <div class="metric-value" :class="storage.disk_free_mb < 200 ? 'text-danger' : storage.disk_free_mb < 500 ? 'text-warning' : ''" x-text="$bytes(storage.disk_free_mb * 1048576)"></div>
              <div class="metric-meta" x-text="(storage.disk_free_mb / storage.disk_total_mb * 100).toFixed(1) + '% 可用'"></div>
            </div>
            <div class="metric-tile">
              <div class="metric-label"><span>图片数量</span><ui-icon name="images" class="icon-sm"></ui-icon></div>
              <div class="metric-value" x-text="$num(storage.image_count)"></div>
            </div>
            <div class="metric-tile">
              <div class="metric-label"><span>图片占用</span><ui-icon name="layers" class="icon-sm"></ui-icon></div>
              <div class="metric-value" x-text="$bytes(storage.image_size_bytes)"></div>        </div>
          </div>
        </template>

        <div class="row row-wrap">
          <ui-date class="gallery-range" mode="range" placeholder="创建日期" x-model="range" @input="load()"></ui-date>
          <span class="spacer"></span>
          <div class="tabs tabs-box tabs-sm" role="tablist">
            <button type="button" role="tab" class="tab" :class="{ 'tab-active': view === 'card' }" @click="view = 'card'">卡片</button>
            <button type="button" role="tab" class="tab" :class="{ 'tab-active': view === 'table' }" @click="view = 'table'">表格</button>
          </div>
        </div>

        <section class="panel panel-flush">
          <div class="panel-head row-wrap">
            <div class="row row-lg row-wrap">
              <span class="text-muted" x-text="'共 ' + $num(items.length) + ' 张'"></span>
              <label class="check-row"><input type="checkbox" class="checkbox checkbox-sm" :checked="pageSelected" :disabled="!items.length" @change="toggle(paged.map((item) => item.rel), $event.target.checked)">本页全选</label>
              <label class="check-row"><input type="checkbox" class="checkbox checkbox-sm" :checked="allSelected" :disabled="!items.length" @change="toggle(items.map((item) => item.rel), $event.target.checked)">全选结果</label>
              <span class="text-muted" x-show="selected.length" x-text="'已选 ' + selected.length + ' 张'"></span>
            </div>
            <div class="row row-wrap">
              <template x-if="selected.length">
                <div class="row">
                  <button type="button" class="btn btn-ghost btn-sm" @click="selected = []">取消选择</button>
                  <button type="button" class="btn btn-sm" :disabled="busy" @click="downloadSelected()"><span class="loading loading-spinner loading-xs" x-show="busy === 'download'"></span><ui-icon name="download" class="icon-sm" x-show="busy !== 'download'"></ui-icon>下载所选</button>
                  <button type="button" class="btn btn-sm btn-error btn-soft" :disabled="busy" @click="remove({ paths: selected }, '删除所选图片', `删除所选的 ${selected.length} 张图片后无法恢复。`)"><ui-icon name="trash-2" class="icon-sm"></ui-icon>删除所选</button>
                </div>
              </template>
              <button type="button" class="btn btn-sm btn-error btn-soft" x-show="filtered && !selected.length" :disabled="busy || !items.length" @click="remove({ ...filters, all_matching: true }, '删除符合条件的图片', `删除当前筛选出的 ${items.length} 张图片后无法恢复。`)"><ui-icon name="trash-2" class="icon-sm"></ui-icon>删除筛选结果</button>
            </div>
          </div>

          <div class="gallery-grid" x-show="view === 'card' && paged.length">
            <template x-for="item in paged" :key="item.rel">
              <div class="gallery-card vstack vstack-sm" :class="{ selected: selected.includes(item.rel) }">
                <div class="gallery-media">
                  <button type="button" class="thumb gallery-thumb" aria-label="预览" @click="preview(item)">
                    <img :src="item.thumbnail_url" alt="" loading="lazy" @error="$el.src !== item.url && ($el.src = item.url)">
                  </button>
