                  <input type="checkbox" class="checkbox checkbox-sm gallery-check" :checked="selected.includes(item.rel)" aria-label="选择" @change="toggle([item.rel], $event.target.checked)">
                  <span class="gallery-meta num" x-text="$bytes(item.size) + ' · ' + item.width + ' × ' + item.height"></span>
                </div>
                <div class="row">
                  <span class="grow truncate text-xs text-muted num" x-text="item.created_at"></span>
                  <button type="button" class="btn btn-ghost btn-xs btn-square tooltip" data-tip="下载" aria-label="下载" @click="download(item)"><ui-icon name="download" class="icon-sm"></ui-icon></button>
                  <button type="button" class="btn btn-ghost btn-xs btn-square tooltip" data-tip="复制地址" aria-label="复制地址" @click="$copy(item.url)"><ui-icon name="link-2" class="icon-sm"></ui-icon></button>
                  <button type="button" class="btn btn-ghost btn-xs btn-square tooltip text-danger" data-tip="删除" aria-label="删除" @click="remove({ paths: [item.rel] }, '删除图片', '删除后无法恢复。')"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                </div>
              </div>
            </template>
          </div>

          <div class="table-wrap" x-show="view === 'table' && paged.length">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="本页全选" :checked="pageSelected" @change="toggle(paged.map((item) => item.rel), $event.target.checked)"></th>
                  <th>图片</th><th>名称</th><th>创建时间</th><th>尺寸</th><th>大小</th><th class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="item in paged" :key="item.rel">
                  <tr>
                    <td class="col-check"><input type="checkbox" class="checkbox checkbox-sm" :aria-label="'选择 ' + item.name" :checked="selected.includes(item.rel)" @change="toggle([item.rel], $event.target.checked)"></td>
                    <td>
                      <button type="button" class="thumb gallery-thumb-sm" :aria-label="'预览 ' + item.name" @click="preview(item)">
                        <img :src="item.thumbnail_url" alt="" loading="lazy" @error="$el.src !== item.url && ($el.src = item.url)">
                      </button>
                    </td>
                    <td class="gallery-name"><span class="mono copyable truncate" title="点击复制地址" x-text="item.name" @click="$copy(item.url)"></span></td>
                    <td class="num text-muted nowrap" x-text="item.created_at"></td>
                    <td class="num nowrap" x-text="item.width + ' × ' + item.height"></td>
                    <td class="num nowrap" x-text="$bytes(item.size)"></td>
                    <td class="col-actions">
                      <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="预览" aria-label="预览" @click="preview(item)"><ui-icon name="maximize-2" class="icon-sm"></ui-icon></button>
                      <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="下载" aria-label="下载" :disabled="busy" @click="download(item)"><ui-icon name="download" class="icon-sm"></ui-icon></button>
                      <button type="button" class="btn btn-ghost btn-sm btn-square tooltip text-danger" data-tip="删除" aria-label="删除" :disabled="busy" @click="remove({ paths: [item.rel] }, '删除图片', `删除「${item.name}」后无法恢复。`)"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <div class="center-fill" x-show="loading && !items.length"><span class="loading loading-spinner loading-sm"></span></div>
          <div class="empty" x-show="!loading && !items.length"><ui-icon name="images"></ui-icon><span x-text="filtered ? '没有符合条件的图片' : '暂无图片'"></span></div>
          <ui-pager x-show="items.length > 12" :page="page" :size="size" :total="items.length" sizes="12,24,48" @change="page = $event.detail.page; size = $event.detail.size"></ui-pager>
        </section>
      </div>

      <dialog class="modal" x-effect="byDate.open ? $el.showModal() : $el.close()" @close="byDate.open = false">
        <form class="modal-box vstack" @submit.prevent="removeByDate()">
          <h3 class="modal-title">按日期删除</h3>
          <div class="field">
            <span class="field-label">删除这一天及之前的全部图片</span>
            <ui-date placeholder="选择日期" x-model="byDate.date"></ui-date>
          </div>
          <div role="alert" class="alert alert-soft alert-warning"><ui-icon name="triangle-alert"></ui-icon><span>图片及缩略图会被永久删除，无法恢复。</span></div>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="byDate.open = false">取消</button>
            <button type="submit" class="btn btn-sm btn-error" :disabled="!byDate.date || busy"><span class="loading loading-spinner loading-xs" x-show="busy === 'delete'"></span>删除</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>

      <dialog class="modal" x-effect="cleanup.open ? $el.showModal() : $el.close()" @close="cleanup.open = false">
        <form class="modal-box vstack" @submit.prevent="cleanupSpace()">
          <h3 class="modal-title">清理空间</h3>
          <label class="field">
            <span class="field-label">目标剩余空间<span class="tooltip tooltip-right field-help" data-tip="从最早的图片开始删除，直到磁盘剩余空间达到目标值"><ui-icon name="info" class="icon-sm"></ui-icon></span></span>
            <span class="input input-sm"><input type="number" x-model.number="cleanup.target"><span class="text-subtle">MB</span></span>
          </label>
          <div class="modal-action">
            <button type="button" class="btn btn-sm" @click="cleanup.open = false">取消</button>
            <button type="submit" class="btn btn-sm btn-error" :disabled="!cleanup.target || busy"><span class="loading loading-spinner loading-xs" x-show="busy === 'cleanup'"></span>开始清理</button>
          </div>
        </form>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>
    </div>
  </template>

  <template id="page-logs">
    <div class="page" x-data="logs">
      <div class="page-head">
        <h1 class="title-page">日志</h1>
        <div class="row row-wrap">
          <span class="logs-refresh" x-show="refreshedAt" x-text="'上次刷新 ' + refreshedAt"></span>
          <ui-date class="logs-range" mode="range" placeholder="记录日期" x-model="range" @input="go(1, size)"></ui-date>
          <label class="check-row"><input type="checkbox" class="toggle toggle-sm" x-model="auto">自动刷新</label>
          <ui-select x-model="interval" :disabled="!auto">
            <template x-for="value in ['3', '5', '10', '30', '60']" :key="value"><option :value="value" x-text="value + ' 秒'"></option></template>
          </ui-select>
          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-left" data-tip="刷新" aria-label="刷新" @click="load()"><ui-icon name="refresh-cw" class="icon-sm"></ui-icon></button>
        </div>
      </div>

      <div class="vstack">
        <div role="alert" class="alert alert-error alert-soft" x-show="error" x-cloak>
          <ui-icon name="circle-x"></ui-icon><span>日志暂时无法更新：<span x-text="error"></span></span>
        </div>

        <section class="panel panel-flush">
          <div class="panel-head" x-show="selected.length" x-cloak>
            <span class="text-muted" x-text="'已选 ' + selected.length + ' 条'"></span>
            <div class="row">
              <button type="button" class="btn btn-ghost btn-sm" @click="selected = []">取消选择</button>
              <button type="button" class="btn btn-sm btn-error btn-soft" @click="remove([...selected])"><ui-icon name="trash-2" class="icon-sm"></ui-icon>删除所选</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="本页全选" :checked="pageSelected" :disabled="!items.length" @change="selected = $event.target.checked ? items.map((log) => log.id) : []"></th>
                  <th>时间</th><th>令牌名称</th><th>进度</th><th>图片</th><th>Endpoint</th><th class="col-actions">操作</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="log in items" :key="log.id">
                  <tr>
                    <td class="col-check"><input type="checkbox" class="checkbox checkbox-sm" aria-label="选择日志" :value="log.id" x-model="selected"></td>
                    <td class="num text-muted nowrap" x-text="$time(log.time)"></td>
                    <td class="nowrap" x-text="log.detail.key_name"></td>
                    <td class="logs-progress">
                      <div class="vstack vstack-xs">
                        <div class="row">
                          <ui-icon class="icon-sm" :class="status(log).tone + (log.detail.status === 'running' ? ' spin' : '')" :name="status(log).icon"></ui-icon>
                          <span class="grow truncate" :title="log.detail.stage" x-text="log.detail.stage"></span>
                          <span class="logs-duration num text-muted" x-text="$duration(duration(log))"></span>
                          <span class="badge badge-sm badge-soft" :class="status(log).badge" x-text="status(log).label"></span>
                        </div>
                        <progress class="progress logs-bar" :class="status(log).bar" :value="log.detail.status === 'running' ? null : 100" max="100"></progress>
                      </div>
                    </td>
                    <td>
                      <div class="row row-xs" x-show="urls(log).length">
                        <template x-for="(url, index) in urls(log).slice(0, 3)" :key="url">
                          <button type="button" class="thumb logs-thumb" aria-label="查看图片" @click="preview(log, index)">
                            <img :src="thumb(url)" alt="" loading="lazy" @error="$el.src !== url && ($el.src = url)">
                          </button>
                        </template>
                        <span class="text-xs text-muted" x-show="urls(log).length > 3" x-text="'+' + (urls(log).length - 3)"></span>
                      </div>
                      <span class="text-subtle" x-show="!urls(log).length">—</span>
                    </td>
                    <td class="logs-endpoint"><span class="mono truncate" :title="log.detail.endpoint" x-text="log.detail.endpoint"></span></td>
                    <td class="col-actions">
                      <button type="button" class="btn btn-ghost btn-sm btn-square tooltip" data-tip="详情" aria-label="详情" @click="detail = log; detailTab = 'overview'"><ui-icon name="eye" class="icon-sm"></ui-icon></button>
                      <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-left text-danger" data-tip="删除" aria-label="删除" @click="remove([log.id])"><ui-icon name="trash-2" class="icon-sm"></ui-icon></button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div class="center-fill" x-show="loading"><span class="loading loading-spinner loading-sm"></span></div>
          <div class="empty" x-show="!loading && !items.length"><ui-icon name="scroll-text"></ui-icon><span>暂无日志</span></div>
          <ui-pager x-show="total > 10" :page="page" :size="size" :total="total" @change="go($event.detail.page, $event.detail.size)"></ui-pager>
        </section>
      </div>

      <dialog class="modal" x-effect="detail ? $el.showModal() : $el.close()" @close="detail = null">
        <div class="modal-box logs-modal">
          <template x-if="detail">
            <div class="vstack">
              <div class="modal-head">
                <h3 class="modal-title">调用详情</h3>
                <div class="tabs tabs-box tabs-sm" role="tablist">
                  <template x-for="[key, label] in [['overview', '概览'], ['events', '进度'], ['images', '图片'], ['raw', '原始数据']]" :key="key">
                    <button type="button" role="tab" class="tab" :class="{ 'tab-active': detailTab === key }" x-show="key !== 'images' || urls(detail).length" @click="detailTab = key" x-text="label"></button>
                  </template>
                </div>
                <button type="button" class="btn btn-ghost btn-sm btn-square" aria-label="关闭" @click="detail = null"><ui-icon name="x" class="icon-sm"></ui-icon></button>
              </div>

              <div class="vstack vstack-lg" x-show="detailTab === 'overview'">
                <dl class="inline-stats">
                  <div><dt>状态</dt><dd class="row row-xs"><ui-icon class="icon-sm" :class="status(detail).tone" :name="status(detail).icon"></ui-icon><span x-text="status(detail).title"></span></dd></div>
                  <div><dt>阶段</dt><dd class="truncate" :title="detail.detail.stage" x-text="detail.detail.stage"></dd></div>
                  <div><dt>耗时</dt><dd class="num" x-text="$duration(duration(detail))"></dd></div>
                  <div><dt>进度节点</dt><dd class="num" x-text="detail.detail.events.length"></dd></div>
                </dl>
                <dl class="logs-overview">
                  <div class="logs-item"><dt>日志 ID</dt><dd><span class="mono copyable" title="点击复制" x-text="detail.id" @click="$copy(detail.id)"></span></dd></div>
                  <div class="logs-item"><dt>记录时间</dt><dd class="num" x-text="$time(detail.time)"></dd></div>
                  <div class="logs-item" :class="{ 'logs-item-long': detail.summary.length > 24 }"><dt>日志简述</dt><dd x-text="detail.summary"></dd></div>
                  <template x-for="[key, value] in scalars" :key="key">
                    <div class="logs-item" :class="{ 'logs-item-long': String(value).length > 24 || String(value).includes('\n') }"><dt x-text="label(key)"></dt><dd class="pre-wrap" x-text="value"></dd></div>
                  </template>
                </dl>
              </div>

              <div x-show="detailTab === 'events'">
                <div class="empty" x-show="!detail.detail.events.length"><ui-icon name="list-tree"></ui-icon>暂无进度记录</div>
                <ol class="logs-steps">
                  <template x-for="(event, index) in detail.detail.events" :key="index">
                    <li class="logs-step">
                      <ui-icon class="icon-sm logs-step-icon" :class="index === detail.detail.events.length - 1 ? status(detail).tone : 'text-success'" :name="index === detail.detail.events.length - 1 ? status(detail).icon : 'circle-check'"></ui-icon>
                      <div class="logs-step-body">
                        <div class="row row-between logs-step-head">
                          <span class="text-strong" x-text="event.message"></span>
                          <span class="text-xs text-muted num"><span x-text="event.time"></span><span class="logs-elapsed" x-text="$duration(event.elapsed_ms)"></span></span>
                        </div>
                        <dl class="kv logs-event-kv tile mono text-xs" x-show="Object.keys(event.detail ?? {}).some((key) => key !== 'position')">
                          <template x-for="[key, value] in Object.entries(event.detail ?? {}).filter(([key]) => key !== 'position')" :key="key">
                            <div class="logs-kv-row"><dt x-text="key"></dt><dd x-text="format(value)"></dd></div>
                          </template>
                        </dl>
                      </div>
                    </li>
                  </template>
                </ol>
              </div>

              <div class="logs-images" x-show="detailTab === 'images'">
                <template x-for="(url, index) in urls(detail)" :key="url">
                  <button type="button" class="thumb logs-image" aria-label="查看图片" @click="preview(detail, index)">
                    <img :src="thumb(url)" alt="" loading="lazy" @error="$el.src !== url && ($el.src = url)">
                  </button>
                </template>
              </div>

              <pre class="code" x-show="detailTab === 'raw'" x-text="json"></pre>
            </div>
          </template>
        </div>
        <form method="dialog" class="modal-backdrop"><button>关闭</button></form>
      </dialog>
    </div>
  </template>

  <template id="page-settings">
    <div class="page page-split" x-data="settings">
      <div class="page-head">
        <h1 class="title-page">设置</h1>
        <div class="row" x-show="config">
          <button type="button" class="btn btn-ghost btn-sm btn-square tooltip tooltip-left" data-tip="撤销未保存的修改" aria-label="撤销未保存的修改" :disabled="busy || !dirty" @click="undo()"><ui-icon name="rotate-ccw" class="icon-sm"></ui-icon></button>
          <button type="button" class="btn btn-sm btn-primary" :disabled="busy || !dirty" @click="run('save', () => save())"><span class="loading loading-spinner loading-xs" x-show="busy === 'save'"></span>保存</button>
        </div>
      </div>

      <div class="center-fill" x-show="!config"><span class="loading loading-spinner loading-sm"></span></div>

      <template x-if="config">
        <div class="settings-layout">
          <nav class="settings-nav" aria-label="设置分组">
            <template x-for="item in tabs" :key="item.key">
              <button type="button" class="nav-item" :aria-current="tab === item.key ? 'page' : null" @click="tab = item.key"><span class="grow" x-text="item.label"></span><span class="nav-dot" x-show="isDirty(item.key)" aria-label="有未保存的修改"></span></button>
            </template>
          </nav>

          <section class="settings-body">
            <h2 class="settings-title" x-text="tabs.find((item) => item.key === tab).label"></h2>

            <!-- 全局设置 -->
            <div x-show="tab === 'global'">
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">生图模型名称</div><p class="setting-desc">对外提供的生图模型名称，留空使用 gpt-image-2.6。</p></div>
                <input class="input input-sm mono" x-model="config.image_model_name" placeholder="gpt-image-2.6">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">默认上游模型</div><p class="setting-desc">网页对话、网页生图和语音请求上游时使用的模型，auto 由上游自动选择。</p></div>
                <input class="input input-sm mono" x-model="config.default_upstream_model_name" placeholder="auto">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">默认思考强度</div><p class="setting-desc">模型名未指定思考强度时使用的级别。</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in thinking"><button type="button" class="tab" :class="{ 'tab-active': config.default_thinking_effort === value }" @click="config.default_thinking_effort = value" x-text="label"></button></template></div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Codex 生图模型</div><p class="setting-desc">Codex 线路生成图片时调用的模型。</p></div>
                <input class="input input-sm mono" x-model="config.image_codex_model" placeholder="gpt-6-luna">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">Codex 画图模型</div><p class="setting-desc">Codex 线路实际生成图片的画图工具所用模型。</p></div>
                <input class="input input-sm mono" x-model="config.image_codex_image_model" placeholder="gpt-image-2.6">
              </div>
              <div class="setting-row setting-row-block">
                <div class="setting-text"><div class="setting-name">全局附加指令</div><p class="setting-desc">每次请求都会作为系统指令附加在对话最前面。</p></div>
                <textarea class="textarea textarea-sm" rows="8" x-model="config.global_system_prompt" placeholder="输入统一约束或角色设定"></textarea>
              </div>
            </div>

            <!-- 账号维护 -->
            <div x-show="tab === 'account'">
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">账号刷新间隔</div><p class="setting-desc">自动刷新账号额度与状态的频率。</p></div>
                <label class="input input-sm"><input type="number" x-model.number="config.refresh_account_interval_minute"><span class="text-subtle">分钟</span></label>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">自动移除异常账号</div><p class="setting-desc">账号失效或无法使用时从号池中移除。</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in onOff"><button type="button" class="tab" :class="{ 'tab-active': config.auto_remove_invalid_accounts === value }" @click="config.auto_remove_invalid_accounts = value" x-text="label"></button></template></div>
              </div>
            </div>

            <!-- 图片生成 -->
            <div x-show="tab === 'image'">
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">图片访问地址</div><p class="setting-desc">生成图片结果链接使用的地址前缀。</p></div>
                <input class="input input-sm" x-model="config.base_url" placeholder="https://example.com">
              </div>
              <template x-for="item in imageNumbers" :key="item.key">
                <div class="setting-row">
                  <div class="setting-text"><div class="setting-name" x-text="item.label"></div><p class="setting-desc" x-text="item.desc"></p></div>
                  <label class="input input-sm"><input type="number" x-model.number="config[item.key]"><span class="text-subtle" x-text="item.unit"></span></label>
                </div>
              </template>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">任务结束后移除本地对话</div><p class="setting-desc">图片任务完成、失败或超时后，隐藏对应的对话记录。</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in onOff"><button type="button" class="tab" :class="{ 'tab-active': config.remove_conversation_after_result === value }" @click="config.remove_conversation_after_result = value" x-text="label"></button></template></div>
              </div>
            </div>

            <!-- 图片存储 -->
            <div x-show="tab === 'storage'">
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">保存位置</div><p class="setting-desc">生成的图片保存在本机、WebDAV 或同时保存。</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in storageModes"><button type="button" class="tab" :class="{ 'tab-active': config.image_storage.mode === value }" @click="config.image_storage.mode = value; config.image_storage.enabled = value !== 'local'" x-text="label"></button></template></div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">WebDAV 地址</div><p class="setting-desc">WebDAV 服务的访问地址。</p></div>
                <input class="input input-sm" x-model="config.image_storage.webdav_url" :disabled="config.image_storage.mode === 'local'" placeholder="https://example.com/dav">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">用户名</div><p class="setting-desc">登录 WebDAV 使用的用户名。</p></div>
                <input class="input input-sm" x-model="config.image_storage.webdav_username" :disabled="config.image_storage.mode === 'local'" autocomplete="off">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">密码</div><p class="setting-desc">登录 WebDAV 使用的密码。</p></div>
                <input type="password" class="input input-sm" x-model="config.image_storage.webdav_password" :disabled="config.image_storage.mode === 'local'" autocomplete="new-password">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">远端目录</div><p class="setting-desc">图片在 WebDAV 中的保存目录。</p></div>
                <input class="input input-sm" x-model="config.image_storage.webdav_root_path" :disabled="config.image_storage.mode === 'local'" placeholder="chatgpt2api/images">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">公开访问前缀</div><p class="setting-desc">图片对外展示使用的地址前缀；不填写时通过本服务的 /images/ 地址访问。</p></div>
                <input class="input input-sm" x-model="config.image_storage.public_base_url" :disabled="config.image_storage.mode === 'local'" placeholder="https://cdn.example.com/images">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">连接与同步</div><p class="setting-desc">先保存当前设置，再测试连接或把本机已有图片补传到 WebDAV。</p></div>
                <div class="vstack vstack-xs">
                  <div class="row row-end">
                    <button type="button" class="btn btn-sm" :disabled="busy || config.image_storage.mode === 'local'" @click="testStorage()"><span class="loading loading-spinner loading-xs" x-show="busy === 'test-storage'"></span><ui-icon name="cloud" class="icon-sm" x-show="busy !== 'test-storage'"></ui-icon>测试连接</button>
                    <button type="button" class="btn btn-sm" :disabled="busy || config.image_storage.mode === 'local'" @click="syncStorage()"><span class="loading loading-spinner loading-xs" x-show="busy === 'sync'"></span><ui-icon name="refresh-cw" class="icon-sm" x-show="busy !== 'sync'"></ui-icon>全量同步</button>
                  </div>
                  <span class="text-xs text-right" :class="results.storage?.ok ? 'text-success' : 'text-danger'" x-show="results.storage" x-text="results.storage?.text"></span>
                </div>
              </div>
            </div>

            <!-- 网络代理 -->
            <div x-show="tab === 'proxy'">
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">全局代理</div><p class="setting-desc">未单独配置代理的账号统一使用该代理，支持 HTTP、HTTPS、SOCKS5。</p></div>
                <div class="vstack vstack-xs">
                  <div class="input-group">
                    <input class="input input-sm" x-model="config.proxy" placeholder="http://127.0.0.1:7890" @input="results.proxy = null">
                    <button type="button" class="btn btn-sm" :disabled="busy || !config.proxy" @click="testProxy()"><span class="loading loading-spinner loading-xs" x-show="busy === 'test-proxy'"></span>测试</button>
                  </div>
                  <span class="text-xs" :class="results.proxy?.ok ? 'text-success' : 'text-danger'" x-show="results.proxy" x-text="results.proxy?.text"></span>
                </div>
              </div>
            </div>

            <!-- FlareSolverr -->
            <div x-show="tab === 'clearance'">
              <div role="alert" class="alert alert-soft alert-warning settings-alert">
                <ui-icon name="triangle-alert"></ui-icon>
                <span>使用前需先启动 flaresolverr、privoxy、warp-proxy 容器。代理优先级：账号代理 &gt; 清障代理 &gt; 显式代理 &gt; 全局代理。</span>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">启用清障</div><p class="setting-desc">请求被 Cloudflare 拦截时获取通行凭证后重试。</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in onOff"><button type="button" class="tab" :class="{ 'tab-active': config.proxy_runtime.enabled === value }" @click="config.proxy_runtime.enabled = value" x-text="label"></button></template></div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">出站方式</div><p class="setting-desc">使用 WARP 部署时选择单代理 / WARP。</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in egressModes"><button type="button" class="tab" :class="{ 'tab-active': config.proxy_runtime.egress_mode === value }" :disabled="!config.proxy_runtime.enabled" @click="config.proxy_runtime.egress_mode = value" x-text="label"></button></template></div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">清障代理地址</div><p class="setting-desc">支持 http、https、socks5；带认证可写成 协议://账号:密码@主机:端口。</p></div>
                <div class="vstack vstack-xs">
                  <div class="input-group">
                    <input class="input input-sm" x-model="config.proxy_runtime.proxy_url" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.egress_mode !== 'single_proxy'" placeholder="http://privoxy:8118">
                    <button type="button" class="btn btn-sm" :disabled="busy || !config.proxy_runtime.enabled" @click="testRuntimeProxy()"><span class="loading loading-spinner loading-xs" x-show="busy === 'test-runtime'"></span>测试</button>
                  </div>
                  <span class="text-xs" :class="results.runtime?.ok ? 'text-success' : 'text-danger'" x-show="results.runtime" x-text="results.runtime?.text"></span>
                </div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">资源代理地址</div><p class="setting-desc">下载图片等资源时使用的代理；不填写时使用清障代理。</p></div>
                <input class="input input-sm" x-model="config.proxy_runtime.resource_proxy_url" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.egress_mode !== 'single_proxy'">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">凭证获取方式</div><p class="setting-desc">手动填写 Cookie，或通过 FlareSolverr 自动获取。</p></div>
                <div class="tabs tabs-box tabs-sm segmented"><template x-for="[value, label] in clearanceModes"><button type="button" class="tab" :class="{ 'tab-active': config.proxy_runtime.clearance.mode === value }" :disabled="!config.proxy_runtime.enabled" @click="config.proxy_runtime.clearance.mode = value" x-text="label"></button></template></div>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">FlareSolverr 地址</div><p class="setting-desc">容器部署时通常为 http://flaresolverr:8191。</p></div>
                <input class="input input-sm" x-model="config.proxy_runtime.clearance.flaresolverr_url" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode !== 'flaresolverr'" placeholder="http://flaresolverr:8191">
              </div>
              <template x-for="item in clearanceNumbers" :key="item.key">
                <div class="setting-row">
                  <div class="setting-text"><div class="setting-name" x-text="item.label"></div><p class="setting-desc" x-text="item.desc"></p></div>
                  <label class="input input-sm"><input type="number" x-model.number="config.proxy_runtime.clearance[item.key]" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode === 'none'"><span class="text-subtle">秒</span></label>
                </div>
              </template>
              <div class="setting-row setting-row-block">
                <div class="setting-text"><div class="setting-name">User-Agent</div><p class="setting-desc">获取与使用通行凭证时携带的浏览器标识。</p></div>
                <input class="input input-sm mono" x-model="config.proxy_runtime.clearance.user_agent" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode === 'none'">
              </div>
              <div class="setting-row setting-row-block">
                <div class="setting-text"><div class="setting-name">手动 Cookie</div><p class="setting-desc" x-text="config.proxy_runtime.clearance.has_cf_cookies || config.proxy_runtime.clearance.has_cf_clearance ? '已保存过 Cookie，留空保存不会清除；保存后不再显示原值。' : '保存后不再显示原值。'"></p></div>
                <textarea class="textarea textarea-sm mono" rows="3" x-model="config.proxy_runtime.clearance.cf_cookies" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode !== 'manual'" placeholder="foo=bar; cf_clearance=..."></textarea>
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">单独 cf_clearance</div><p class="setting-desc">只填写 cf_clearance 的值。</p></div>
                <input class="input input-sm mono" x-model="config.proxy_runtime.clearance.cf_clearance" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode !== 'manual'">
              </div>
              <div class="setting-row">
                <div class="setting-text"><div class="setting-name">测试获取凭证</div><p class="setting-desc">先保存当前设置，再对目标地址获取一次通行凭证。</p></div>
                <div class="vstack vstack-xs">
                  <div class="input-group">
                    <input class="input input-sm" x-model="targetUrl" :disabled="!config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode === 'none'">
                    <button type="button" class="btn btn-sm" :disabled="busy || !config.proxy_runtime.enabled || config.proxy_runtime.clearance.mode === 'none'" @click="testClearance()"><span class="loading loading-spinner loading-xs" x-show="busy === 'test-clearance'"></span>测试</button>
                  </div>
                  <span class="text-xs" :class="results.clearance?.ok ? 'text-success' : 'text-danger'" x-show="results.clearance" x-text="results.clearance?.text"></span>
                </div>
              </div>
            </div>
          </section>
        </div>
      </template>
    </div>
  </template>

  <template id="page-docs">
    <div class="page docs" x-data="docs">
      <nav class="docs-nav" aria-label="文档目录">
        <div class="nav-group">开始使用</div>
        <template x-for="[id, label] in guides" :key="id">
          <button type="button" class="nav-item" :aria-current="active === id ? 'page' : null" x-text="label" @click="jump(id)"></button>
        </template>
        <div class="nav-group">接口</div>
        <template x-for="(item, index) in docs" :key="item.path">
          <button type="button" class="nav-item" :aria-current="active === 'endpoint-' + index ? 'page' : null" @click="jump('endpoint-' + index)">
            <span class="docs-method mono" :class="item.method === 'GET' ? 'text-success' : 'text-muted'" x-text="item.method"></span>
            <span class="truncate" x-text="item.title"></span>
          </button>
        </template>
      </nav>

      <article class="docs-body vstack vstack-lg">
        <section id="overview" class="docs-section vstack vstack-md">
          <div class="row">
            <h1 class="title-page">接入说明</h1>
            <span class="tooltip tooltip-right field-help" data-tip="第三方应用可通过 OpenAI 兼容协议调用模型、对话、搜索、图片生成及可编辑文件任务，所有接口使用统一地址和 Bearer Token 鉴权。"><ui-icon name="info" class="icon-sm"></ui-icon></span>
          </div>
          <div class="grid grid-2">
            <div class="panel vstack vstack-xs">
              <span class="field-label">服务地址</span>
              <span class="mono copyable break-all" title="点击复制" x-text="base" @click="$copy(base)"></span>
            </div>
            <div class="panel vstack vstack-xs">
              <span class="field-label">OpenAI Base URL</span>
              <span class="mono copyable break-all" title="点击复制" x-text="base + '/v1'" @click="$copy(base + '/v1')"></span>
            </div>
          </div>
        </section>

        <section id="authentication" class="docs-section vstack vstack-md">
          <div class="row">
            <h2 class="title-section">身份认证</h2>
            <span class="tooltip tooltip-right field-help" data-tip="每次请求在 Authorization Header 中携带 API Key。"><ui-icon name="info" class="icon-sm"></ui-icon></span>
          </div>
          <pre class="code copyable" title="点击复制" x-text="'Authorization: Bearer ' + key" @click="$copy('Authorization: Bearer ' + key)"></pre>
        </section>

        <section id="models" class="docs-section vstack vstack-md">
          <div class="row">
            <h2 class="title-section">可用模型</h2>
          </div>
          <div class="row row-wrap">
            <template x-for="model in models" :key="model">
              <ui-model :name="model"></ui-model>
            </template>
          </div>
        </section>

        <template x-for="(item, index) in docs" :key="item.path">
          <section :id="'endpoint-' + index" class="docs-section vstack vstack-md">
            <div class="vstack vstack-xs">
              <h2 class="title-section" x-text="item.title"></h2>
              <div class="row">
                <span class="badge badge-sm badge-soft mono" :class="item.method === 'GET' ? 'badge-success' : 'badge-neutral'" x-text="item.method"></span>
                <code class="mono text-muted break-all" x-text="item.path"></code>
              </div>
            </div>
            <div class="grid grid-2">
              <template x-for="[label, rows] in [['输入参数', item.input], ['输出参数', item.output]]" :key="label">
                <div class="vstack vstack-sm">
                  <h3 class="field-label" x-text="label"></h3>
                  <div class="panel panel-flush">
                    <div class="table-wrap">
                      <table class="table table-sm">
                        <thead><tr><th>参数</th><th>类型</th><th>说明</th></tr></thead>
                        <tbody>
                          <template x-for="[name, type, desc] in rows" :key="name">
                            <tr><td class="mono nowrap" x-text="name"></td><td class="mono text-muted" x-text="type"></td><td class="text-muted" x-text="desc"></td></tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </template>
            </div>
            <div class="vstack vstack-sm">
              <h3 class="field-label">请求示例</h3>
              <pre class="code copyable" title="点击复制" x-text="item.example(base, key)" @click="$copy(item.example(base, key))"></pre>
            </div>
          </section>
        </template>
      </article>
    </div>
  </template>
</body>
</html>
