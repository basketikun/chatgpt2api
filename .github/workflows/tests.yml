name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        # httpx (TestClient) and pytest (a few pytest-style test modules) are
        # declared under [dependency-groups].dev; plain `pip install -e .`
        # does not pull them in.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . httpx pytest

      - name: Run offline test suite
        env:
          CHATGPT2API_AUTH_KEY: ci-test-key
        run: python -m unittest discover -s test -v

      - name: Run pytest-style modules
        env:
          CHATGPT2API_AUTH_KEY: ci-test-key
        run: python -m pytest test/test_database_storage.py -q

      - name: Validate Compose files
        env:
          CHATGPT2API_AUTH_KEY: ci-test-key
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.local.yml config >/dev/null
