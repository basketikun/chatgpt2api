services:
  app:
    image: ghcr.io/basketikun/chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
      - ./services:/app/services:ro
      - ./web/out:/app/web_dist:ro
