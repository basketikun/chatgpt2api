; Run Xvfb + Fluxbox + x11vnc + websockify (noVNC) + the FastAPI app together.
[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1366x768x24 -ac +extension RANDR
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -forever -shared -rfbport 5900 -quiet
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
; noVNC ships a static front-end at /usr/share/novnc/ + websockify proxy on 6080
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cloak_bridge]
; Optional second stealth layer (cloakbrowser). Bound to localhost only —
; never exposed in EXPOSE so the captcha-solver API stays the sole external
; entrypoint. CLOAK_BROWSER_ENABLED gates whether Python actually routes
; through it; the bridge itself launches regardless so a runtime env flip
; takes effect without needing a restart.
command=/usr/bin/node /app/cloak-bridge/server.js
directory=/app/cloak-bridge
environment=DISPLAY=":99",CLOAK_BRIDGE_PORT="8011",CLOAK_HEADLESS="1"
autorestart=true
priority=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/usr/local/bin/uvicorn src.main:app --host 0.0.0.0 --port 8010 --workers 1
directory=/app
environment=DISPLAY=":99",PYTHONPATH="/app",CLOAK_BRIDGE_URL="http://127.0.0.1:8011"
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
